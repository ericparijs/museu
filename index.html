  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

watchClip='观看视频'; UI_STRINGS.ja.watchClip='動画を見る'; UI_STRINGS.ru.watchClip='Смотреть видео';\nUI_STRINGS.pt.followAlong='Acompanhar';\nUI_STRINGS.en.followAlong='Follow along';\nUI_STRINGS.es.followAlong='Seguir el texto';\nUI_STRINGS.fr.followAlong='Suivre le texte';\nUI_STRINGS.de.followAlong='Mitlesen';\nUI_STRINGS.it.followAlong='Segui il testo';\nUI_STRINGS.nl.followAlong='Meelezen';\nUI_STRINGS.zh.followAlong='跟随朗读';\nUI_STRINGS.ja.followAlong='音声に合わせる';\n\nfunction ui(lang, key) { return (UI_STRINGS[lang] && UI_STRINGS[lang][key]) || UI_STRINGS.en[key]; }\nconst R2 = 'https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/';\nconst IT_NAMES = [\n\"Museo della Carta di Santa Maria da Feira\",\n\"L'Antica Fabbrica degli Azevedos\",\n\"Rovina della Fabbrica Azevedos de Baixo\",\n\"Il Rio Maior\",\n\"L'Antica Fabbrica Custódio Pais\",\n\"L'Engenho da Lourença\",\n\"Casa del Cilindro\",\n\"Circuito idraulico\",\n\"Casa della Macchina\",\n\"Casa dell'Essiccazione\",\n\"Casa della Levigatura\",\n\"Officina dei Sacchetti di Carta\",\n\"Dalla Foresta alla Carta\",\n\"Cartone Compatto\",\n\"Dalla Filigrana alla Filigrana ad Acqua\",\n];\nconst IT_BODIES = [\n\"Il Museu do Papel Terras de Santa Maria le dà il benvenuto!\\nSiamo un museo industriale dedicato alla storia della carta e la nostra missione principale è preservare la memoria della vita quotidiana dei cartai, in una regione con oltre 300 anni di storia legata all'industria della carta.\\nIn effetti, la prima cartiera del comune fu fondata nel 1708 nella parrocchia di São Paio de Oleiros. Da lì, l'arte di fabbricare la carta si diffuse in tutto il comune e nei comuni vicini. Si giustifica quindi la creazione di un museo dedicato alla storia della carta.\\nSituato a Paços de Brandão, il museo occupa due antiche fabbriche, la Fábrica Custódio Pais e la Fábrica dos Azevedos. È un museo vivo ed esperienziale, che ha preservato l'atmosfera della fabbrica e il know-how dell'arte di fabbricare la carta. \\nLa mostra permanente \\\"Dal Mulino alla Fabbrica\\\" si sviluppa in diverse aree, secondo i processi di produzione manuale e industriale, raccontando la storia della produzione di carta in questa regione.\\nAncora oggi è una delle attività economiche più rappresentative e importanti del comune. Venite con noi a scoprire la storia dell'industria della carta nell'antica Terra de Santa Maria. Le auguriamo un'ottima visita.\",\n\"Conosciuta popolarmente come Fábrica de Cima (fabbrica di sopra), in questo edificio operò l'antica fabbrica degli Azevedos, una delle più importanti unità cartarie del comune di Santa Maria da Feira. \\nFrancisco José de Azevedo Aguiar Brandão fu un uomo innovatore e visionario. Fondò nel 1825 questa \\\"Fabbrica di Carta da Scrivere\\\", come viene indicata nella documentazione dell'epoca.\\nOltre alla produzione di carta da imballaggio, la grande scommessa di questa unità fu la manifattura di carta da scrivere, protocollo e velina. L'eccellente qualità della sua carta da scrittura fu premiata nel 1863 con una medaglia di bronzo assegnata dal re D. Luís I.\\nDi questa antica fabbrica, rimasta attiva fino al 1966, è stato possibile conservare un motore diesel e parte della macchina utilizzata per la triturazione della carta, che qui possiamo osservare.\\nL'enorme formazione rocciosa di questa sala è dovuta al fatto che ci troviamo in un'antica cava di granito sfruttata in passato. Nei giorni di piena, il Rio Maior straripa dalle sue rive, coprendo l'intera massa rocciosa su cui poggia l'edificio.\\nSegua il corridoio, esca verso il giardino e scenda fino alle rovine.\",\n\"Negli anni '40 dell'Ottocento, Francisco José de Azevedo costruì una seconda cartiera, adiacente alla prima, nota come Fábrica de Baixo (fabbrica di sotto).\\nQuesta seconda unità cartaria operò fino al 24 ottobre 1954, una domenica tristemente ricordata nella storia come il \\\"giorno della tromba d'acqua\\\". \\nPiogge intense provocarono un'improvvisa piena delle acque del Rio Maior, causando la distruzione parziale, e in alcuni casi totale, di abitazioni e cartiere.\\nGli edifici della Fábrica de Cima furono completamente ristrutturati l'anno seguente a questa tromba d'acqua, ma la Fábrica de Baixo rimase per sempre in rovina.\",\n\"Il Rio Maior nasce nella parrocchia di Lourosa, comune di Santa Maria da Feira, e sfocia nella Laguna di Paramos (Barrinha de Esmoriz), una laguna costiera situata tra i comuni di Espinho e Ovar. \\nLungo il suo percorso assume il nome dei luoghi o delle parrocchie che attraversa, come Rio de Lamas, Rio Maior, Rio de Paramos, tra le altre denominazioni.\\nQuesto fiume non è navigabile né presenta una portata abbondante, ma entrando nella parrocchia di Paços de Brandão, nella località di Rio Maior, acquisisce un'altra dimensione, creando sbarramenti naturali e artificiali. \\nI forti dislivelli del terreno e gli sbarramenti, chiamati anche \\\"presas\\\", permettevano di condurre l'acqua attraverso canali, rendendo possibile lo sfruttamento energetico grazie all'azione delle ruote idrauliche.\\nIl Rio Maior potrebbe ben chiamarsi \\\"fiume della carta\\\", poiché dalla località di Rio Maior fino alla Laguna di Paramos serviva un tempo quattordici cartiere.\\nProsegua il percorso fino all'edificio successivo.\",\n\"La storia della Fabbrica Custódio Pais risale al 26 ottobre 1822, quando Lourença Pinto e Joaquim de Carvalho firmarono il loro atto di società. Fu la 6ª unità cartaria del comune, ma l'unica ad avere una donna come socia fondatrice.\\nCostruito a partire da due antichi mulini da farina, l'Engenho da Lourença iniziò come un piccolo e rudimentale mulino che fabbricava carta foglio per foglio. \\nLa sua produzione si basava su manodopera scarsa e familiare, e il suo funzionamento dipendeva dall'abbondanza delle acque del Rio Maior.\\nNel 1827 Joaquim de Carvalho fondò un nuovo mulino di carta, accanto al primo ingegno, già allora conosciuto come Engenho da Lourença.\\nQuesti due ingegni cartari furono acquisiti nel 1916 da José Ferreira Pais, che li trasformò in un'unica unità cartaria, avviando anni dopo la produzione di carta in continuo.\\nNegli anni '40 del secolo scorso, la famiglia Ferreira Pais costruì la propria abitazione nell'edificio della fabbrica.\\nQuesta azienda rimase in attività, sempre nella stessa famiglia, fino al 1989.\",\n\"Lourença Pinto fu la prima donna imprenditrice della carta nelle Terras de Santa Maria. Sebbene analfabeta, il suo spirito imprenditoriale la portò ad associarsi nel 1822 con il maestro cartaio Joaquim Carvalho. \\nInsieme costruirono un piccolo ingegno per la produzione artigianale di carta foglio per foglio, adattando alcuni mulini da cereali che Lourença Pinto aveva ereditato da sua madre.\\nIn passato, la materia prima utilizzata nella fabbricazione della carta era costituita da stracci di canapa, lino e cotone, venduti alle cartiere dagli straccivendoli. \\nQuesti stracci, dopo essere stati selezionati al vaglio e tagliati sul tavolo di taglio, venivano raffinati in una macchina chiamata pila olandese, fino a ottenere una pasta omogenea e molto fine.\\nSuccessivamente questa pasta veniva collocata nella tina di produzione, in una soluzione acquosa composta per il 20% da pasta e per l'80% da acqua. \\nCon l'aiuto di una forma (vassoio di legno con fondo in rete metallica), un operaio, chiamato \\\"laurente\\\", raccoglieva le fibre in sospensione, formando così il foglio di carta. Il foglio appena formato veniva rovesciato su un panno di lana, la \\\"baeta\\\" o feltro. \\nSu ogni foglio veniva posto un nuovo feltro, ripetendo il processo fino a ottenere una pila, che veniva poi pressata per eliminare l'acqua in eccesso. I fogli venivano quindi messi ad asciugare nell'Espande.\",\n\"È qui che funzionano le macchine che trasformano la materia prima in pasta di carta.\\nAlla fine del XIX secolo, con l'aumento della domanda di carta e la comparsa di nuove fabbriche, gli stracci divennero scarsi, rendendo necessario trovare nuove materie prime. \\nFurono condotti diversi esperimenti con paglia di diversi cereali, e persino con la lolla di riso, finché non si scoprì che la pasta di legno, ricca di cellulosa, poteva sostituire il tessuto con ottimi risultati.\\nSebbene fin dalla metà del XIX secolo la pasta di legno fosse già utilizzata per la produzione di carta, le fabbriche della nostra regione continuarono a usare stracci di cotone e lino, ai quali aggiungevano carta usata.\\nIn conseguenza dell'uso della carta vecchia come materia prima, comparve una nuova macchina, il mulino a coltelli (moinho de galgas), che facilitò la triturazione della carta.\\nÈ nel mulino a coltelli che si produce la pasta, aggiungendo acqua alla carta usata, triturata da due mole. \\nDopo 1 ora, questa pasta triturata passa attraverso un canale di legno fino alla pila olandese, dove viene raffinata per un periodo equivalente.\\nUna volta raffinata, la pasta risultante viene condotta attraverso un canale inferiore fino alla vasca della ruota del \\\"maxão\\\", situata all'esterno, a destra.\",\n\"L'acqua è sempre stata un elemento fondamentale per la produzione della carta, sia durante il processo di fabbricazione, sia come forza motrice per la produzione di energia idraulica. \\nQuesta energia fu utilizzata nelle cartiere di Santa Maria da Feira fin dall'inizio del XVIII secolo. A partire dall'inizio del XX secolo, l'energia idraulica fu gradualmente sostituita da motori diesel ed elettrici, \\npur mantenendosi come risorsa ogni volta che l'acqua del fiume era sufficiente ad azionare la ruota idraulica.\\nNella Fabbrica Custódio Pais, l'energia elettrica arrivò intorno al 1952, alimentando parte del processo di fabbricazione. Osservi all'esterno, sulla sinistra, la grande ruota che ancora oggi è azionata dalla forza delle acque del Rio Maior. \\nSul lato opposto si trova la vasca della ruota del maxão, che riceve la pasta di carta raffinata nella pila olandese.\\nIl curioso e antico quadro elettrico di colore verde controlla il mulino a coltelli e la pila olandese. Quest'ultima può anche essere azionata da energia idraulica.\",\n\"A partire dal 1920 si iniziò qui a produrre carta riciclata in modo industriale, grazie all'acquisizione di una macchina a tela tonda. Dalla ruota del maxão, la pasta viene raccolta e condotta attraverso un canale fino alla vasca dei vassoi, dove le impurità vengono filtrate. \\nLa quantità di pasta in entrata è controllata dal macchinista, determinando così la grammatura della carta. Dopo la filtrazione, la pasta viene condotta a una seconda vasca chiamata tino. \\nAll'interno del tino, una forma tonda in costante rotazione raccoglie le fibre in sospensione, formando il foglio di carta. Il foglio di carta viene pressato contro il feltro di lana e trasportato fino ai rulli della calandra, dove viene pressato per eliminare l'acqua in eccesso, separandosi dal feltro. \\nSuccessivamente, il macchinista guida la carta verso l'aspo, una sorta di bobina, dove viene avvolta. Poiché ci sono due aspi, quando uno è carico di carta viene sostituito da quello vuoto.\\nLa carta ancora umida viene posta sul tavolo di taglio, dove viene tagliata a mano con un coltello. Viene piegata due volte per formare le \\\"postas\\\" di carta. Queste rimangono accanto al tavolo finché non vengono trasportate alla Casa do Espande, dove vengono messe ad asciugare.\\nProsegua fino alla fine del corridoio, giri a sinistra e salga fino all'ultimo piano.\",\n\"La Casa do Espande è lo spazio destinato all'essiccazione della carta. Situato preferibilmente ai piani superiori, è uno degli spazi più caratteristici di queste antiche fabbriche.\\nCome si può vedere dietro gli attuali vetri di protezione, le pareti erano costituite da persiane di legno regolabili, per permettere la circolazione dell'aria e accelerare l'essiccazione della carta, o proteggere lo spazio dalla pioggia diretta.\\nLe \\\"Botadeiras\\\" erano le operaie che trasportavano sulla testa le pile di carta \\\"verde\\\", ancora umida, dalla Casa da Máquina all'Espande.\\nOgni carico pesava in media 45 chili, non era quindi un compito facile. Già nell'Espande, con l'aiuto di una forcella di legno, le operaie appendevano ad asciugare i fogli di carta piegati a metà, sulle \\\"tesas\\\", una sorta di stendini con fili fissi su supporti di legno. \\nNonostante la durezza di questo lavoro, date le condizioni e lo sforzo richiesto, gli spandi erano luoghi allegri, pieni del canto delle botadeiras, che imprimeva un ritmo costante al lavoro di stendere la carta sulle tesas.\\nDopo l'essiccazione, la carta veniva raccolta e sottoposta a una prima selezione, eliminando i fogli strappati o difettosi. Questi venivano nuovamente riciclati. Dopo questa selezione, la carta veniva portata alla Casa do Lixador.\",\n\"La Casa do Lixador è uno spazio ampio, situato al livello della strada. È il luogo meno freddo e umido di tutto lo stabilimento. Dopo l'essiccazione nella Casa do Espande, la carta veniva trasportata qui per l'ultima fase del processo di fabbricazione: le rifiniture e l'imballaggio.\\nQui le operaie selezionavano la carta di piccolo formato, la \\\"levigavano\\\", cioè la lisciavano, e contavano i fogli.\\nDopo il conteggio, la carta veniva piegata a metà, formando un quaderno di 25 fogli, chiamato una \\\"mano\\\" di carta. L'insieme di 20 \\\"mani\\\" formava una risma.\\nLa carta di grande formato non passava per questo processo di lisciatura e conteggio, ma veniva semplicemente pesata sulla bilancia decimale e collocata direttamente nella pressa. \\nGià nella pressa, la carta veniva battuta lateralmente con un mazzuolo per allineare i fogli, che venivano legati con corda o filo di ferro, formando una balla. Inizialmente le balle erano di 100 kg, ridotte poi a 50 kg, e oggi sono solo di 25 kg.\\nUna volta pronte, le balle e le risme di carta venivano caricate verso l'esterno (attraverso la porta di accesso alla strada), trasportate con carri trainati da buoi, e più tardi con camion, verso il mercato locale o verso i grossisti della città di Porto.\",\n\"A partire dall'inizio del XX secolo, nel comune di Santa Maria da Feira e nei comuni vicini come Ovar, sorsero decine di \\\"Sacarias\\\" dedicate alla produzione di sacchetti di carta.\\nLe Sacarias erano piccole imprese in cui lavoravano essenzialmente donne — le \\\"saqueiras\\\" — che producevano sacchetti di carta chiamati \\\"cartuchos\\\". \\nDopo il taglio, la carta veniva stesa in diagonale sul tavolo della sacaria, con l'aiuto di un righello. Successivamente, veniva applicata sulla carta, con un pennello, una colla a base di farina d'amido e acqua. \\nI sacchetti venivano quindi modellati con l'ausilio di sagome di sacco di varie dimensioni, fissate al piano del tavolo. Una volta realizzati, i sacchetti venivano posti negli essiccatoi per asciugare la colla.\\nIn alcune sacarie potevano esserci macchine per personalizzare il sacchetto. La più comune era la \\\"riscadeira\\\", che stampava linee di colore magenta o blu. Potevano anche esserci piccole macchine tipografiche, come questa di tipo Minerva, \\nche stampava testo con informazioni sul prodotto o sull'esercizio commerciale.\\nA partire dagli anni Sessanta del secolo scorso, con l'affermarsi dell'industria delle materie plastiche, i vecchi sacchetti di carta furono progressivamente sostituiti, provocando il progressivo declino delle sacarie. \\nTuttavia, alcune aziende, puntando sul miglioramento costante del prodotto e sull'innovazione tecnologica, sono ancora oggi pienamente operative, producendo imballaggi per diverse finalità.\\nEsca ora dalla sala e scenda le scale.\",\n\"In questo nucleo espositivo conosceremo il moderno processo di fabbricazione della carta, che utilizza come materia prima il legno di eucalipto e di pino.\\nQuesta mostra presenta sottonuclei sequenziali che esplorano il processo di trasformazione, che inizia dall'albero, ancora inserito nel suo habitat naturale, e termina nella diversità e sostenibilità dei prodotti cartari portoghesi.\\nLungo questo percorso vengono affrontati temi come la gestione sostenibile della foresta e la protezione della biodiversità, la distribuzione delle specie forestali nel Portogallo continentale, i tipi di fibre utilizzati nella produzione di carta, \\nle diverse fasi di trasformazione della materia prima, il processo di fabbricazione e i diversi tipi di carta e le loro caratteristiche.\\nAl termine di questo nucleo, accedendo al chiosco multimediale, potrà accedere a informazioni complementari, in particolare l'identificazione delle fabbriche dedicate alla produzione di pasta e carta in Portogallo, \\ncuriosità sull'eucalipto globulus, sulla produzione della carta e sulla versatilità e applicabilità della carta e del cartone, dai quali derivano nuovi supporti e oggetti quotidiani.\",\n\"Il cartone compatto, chiamato anche \\\"papelão\\\", è un cartone più spesso utilizzato per imballaggi e scatole. Il suo processo di fabbricazione è molto simile a quello della carta. \\nLa principale differenza si verifica al termine della macchina di produzione, momento in cui il cartone, a differenza della carta, non si avvolge sull'aspo, ma viene invece tagliato in lastre, poste una sull'altra, fino al momento dell'essiccazione. \\nIn passato, il cartone era di produzione stagionale, poiché essiccava all'aperto, dipendendo quindi da condizioni climatiche favorevoli. Con il passare degli anni, alcune aziende costruirono una sorta di serra, con nastri trasportatori, per accelerare questo processo di essiccazione. \\nDopo l'essiccazione, il cartone veniva raccolto, selezionato, levigato nella laminatrice e raggruppato in base al rispettivo spessore. Veniva legato in balle da 25 kg. \\nSul lato della balla era indicato il numero totale di fogli di cartone. Balle con più fogli corrispondevano a cartone più sottile.\",\n\"\\\"Dalla Filigrana alla Filigrana ad Acqua\\\" è il nome del nucleo espositivo che nascerà in questo spazio, con la presentazione di una collezione di carte con filigrane nazionali, tra le più rappresentative di questo territorio.\\nLa filigrana è un lavoro ornamentale che utilizza fili metallici molto sottili per formare figure, lettere e numeri. Queste figure, a loro volta, sono ricamate o applicate sulla superficie della rete metallica che compone la forma per fabbricare la carta. \\nLa filigrana della carta, visibile in controluce, è il risultato di questo lavoro, poiché sui fili metallici vi è un minore accumulo di fibre, creando aree di maggiore trasparenza.\\nSegnaliamo qui un rullo filigranatore dell'antica Fabbrica di Carta di Matrena, a Tomar, che reca una filigrana allegorica alla Repubblica Portoghese. Avremo presto altre novità da presentarle qui.\\nPer ora, la nostra visita sta per concludersi.\\nCi auguriamo che abbia apprezzato questo viaggio nel mondo della carta nelle Terras de Santa Maria.\\nSe sta utilizzando un'audioguida del museo, la preghiamo di restituirla alla reception. Potrà inoltre visitare il nostro negozio e portare con sé un ricordo di questa giornata.\\nSe non lo conosce ancora, le suggeriamo una visita al Museu Convento dos Lóios, nella città di Santa Maria da Feira. Grazie e arrivederci alla prossima visita!\",\n];\nconst JA_NAMES = [\n\"サンタ・マリア・ダ・フェイラ紙博物館\",\n\"旧アゼヴェドス工場\",\n\"下アゼヴェドス工場跡\",\n\"リオ・マイオール川\",\n\"旧クストディオ・パイス工場\",\n\"ロウレンサの水車小屋\",\n\"ここでは、原料をパルプに変える機械が稼働しています。\",\n\"水利システム\",\n\"機械室\",\n\"乾燥室\",\n\"研磨室\",\n\"紙袋工房\",\n\"森から紙へ\",\n\"厚紙\",\n\"透かし細工から透かし模様へ\",\n];\nconst JA_BODIES = [\n\"ミュゼウ・ド・パペル テラス・デ・サンタ・マリアへようこそ！\\n当館は紙の歴史をテーマとした産業博物館であり、製紙業と300年以上の歴史を持つこの地域における、紙作りの日常の記憶を保存することを主な使命としています。\\n実際、この地域で最初の製紙工場は1708年、サン・パイオ・デ・オレイロス教区に設立されました。そこから製紙の技術は地域全体、さらには近隣地域へと広まっていきました。紙の歴史に捧げられた博物館の設立は、まさにこうした背景に基づくものです。\\nパソス・デ・ブランダンに位置する当館は、かつての二つの工場、クストディオ・パイス工場とアゼヴェドス工場を利用しています。当館は工場の雰囲気と製紙の技術・知恵（サベール・フェール）を保存した、\\n生きた体験型の博物館です。常設展示「水車から工場へ」は、手工業および工業的な製造工程に沿って複数のエリアに展開され、この地域における紙生産の歴史を物語っています。\\n今日においても、製紙業はこの地域で最も代表的かつ重要な経済活動の一つです。どうぞ私たちと共に、かつてのテラス・デ・サンタ・マリアにおける製紙業の歴史を巡る旅にお出かけください。良いご見学を。\",\n\"一般に「上の工場（ファブリカ・デ・シマ）」として知られるこの建物には、かつてサンタ・マリア・ダ・フェイラ地域で最も重要な製紙工場の一つ、アゼヴェドス工場がありました。フランシスコ・ジョゼ・デ・アゼヴェド・アギアール・ブランダンは、\\n革新的で先見の明のある人物でした。彼は1825年、当時の文書に「筆記用紙工場」として記されるこの工場を設立しました。\\n包装用紙の製造に加え、この工場が特に力を入れていたのは、筆記用紙、帳簿用紙、および薄葉紙の製造でした。その筆記用紙の優れた品質は1863年、国王ドン・ルイス1世より銅メダルを授与され評価されました。\\n1966年まで操業していたこの旧工場からは、ディーゼルエンジンと、紙を粉砕するために使われた機械の一部が保存され、ここで見ることができます。\\nこの部屋の巨大な岩石層は、かつて採掘が行われていた花崗岩の採石場跡地に私たちが立っているためです。増水時にはリオ・マイオール川が氾濫し、建物が建つ岩盤全体を覆います。\\n廊下を進み、庭に出て、遺構へと降りてください。\",\n\"1840年代、フランシスコ・ジョゼ・デ・アゼヴェドは最初の工場に隣接して二つ目の製紙工場を建設し、これは「下の工場（ファブリカ・デ・バイシュ）」として知られるようになりました。\\nこの第二の製紙工場は1954年10月24日まで操業していましたが、この日は「水柱の日」として歴史に悲しく記憶される日曜日でした。激しい雨によりリオ・マイオール川の水位が急激に上昇し、\\n住宅や製紙工場の一部、あるいは場合によっては完全な破壊をもたらしました。\\n上の工場の建物は、この水害の翌年に完全に修復されましたが、下の工場は永遠に廃墟のまま残されました。\",\n\"リオ・マイオール川はサンタ・マリア・ダ・フェイラ地域のロウロサ教区に源を発し、エスピーニョ地域とオヴァール地域の間に位置する沿岸ラグーン、パラモス・ラグーン（バリーニャ・デ・エズモリス）に注ぎます。流れの途中で、\\nリオ・デ・ラマス、リオ・マイオール、リオ・デ・パラモスなど、通過する土地や教区の名前を取ってその名を変えていきます。\\nこの川は航行可能ではなく、水量も豊富ではありませんが、パソス・デ・ブランダン教区、リオ・マイオールと呼ばれる地区に入ると様相を変え、自然および人工の堰を形成します。急な地形の高低差と堰（「プレザス」とも呼ばれる）により、\\n水路を通じて水を導くことができ、水車の作用によるエネルギー利用が可能となりました。\\nリオ・マイオール川は、リオ・マイオール地区からパラモス・ラグーンまでの間にかつて14の製紙工場に水を供給していたことから、「紙の川」と呼んでも差し支えないでしょう。\\n次の建物へと見学を続けてください。\",\n\"クストディオ・パイス工場の歴史は、1822年10月26日、ロウレンサ・ピントとジョアキン・デ・カルヴァリョが共同経営契約を結んだことに遡ります。これはこの地域で6番目の製紙工場でしたが、女性が創業パートナーとなった唯一の工場でした。\\n二つの古い製粉所を改築して作られたエンジェニョ・ダ・ロウレンサは、当初は一枚一枚手作業で紙を作る小規模で原始的な水車小屋として始まりました。その生産は限られた家族労働に支えられ、その稼働はリオ・マイオール川の水量に左右されていました。\\n1827年、ジョアキン・デ・カルヴァリョは、当時すでにエンジェニョ・ダ・ロウレンサとして知られていた最初の水車小屋の隣に、新たな製紙用の水車小屋を設立しました。\\nこの二つの製紙用水車小屋は1916年、ジョゼ・フェレイラ・パイスによって買収され、彼はこれらを一つの製紙工場に統合し、その後、連続製紙生産を開始しました。\\n前世紀の40年代、フェレイラ・パイス家は工場の建物内に自らの住居を建てました。\\nこの会社は同じ一族のもとで、1989年まで操業を続けました。\",\n\"ロウレンサ・ピントは、テラス・デ・サンタ・マリアにおける最初の女性製紙起業家でした。文字を読めなかったにもかかわらず、その起業家精神により、1822年、製紙職人ジョアキン・カルヴァリョと提携するに至りました。二人は、\\nロウレンサ・ピントが母親から受け継いだ穀物用の水車を改造し、一枚一枚手作業で紙を生産するための小さな水車小屋を建てました。\\nかつて紙の製造に使われた原料は、麻、亜麻、綿のぼろ布で、これらは「ファラペイロス（ぼろ布商人）」によって製紙工場に売られていました。これらのぼろ布は、ふるいで選別され、裁断台で切られた後、「\\nオランダ式パルパー」と呼ばれる機械で精製され、均一で非常に細かいパルプが得られるまで処理されました。\\nその後、このパルプは20％のパルプと80％の水からなる水溶液の中、製造用の槽に入れられました。木製の枠（金属製の網を底に張った木の盆）を使い、「ラウレンテ」と呼ばれる職人が浮遊する繊維をすくい取り、こうして紙のシートが形成されました。\\nできたばかりのシートは、羊毛の布、「バエタ」（フェルト）の上に返されました。各シートの上には新しいフェルトが重ねられ、この工程が繰り返されて山が作られ、その後、余分な水分を取り除くために圧搾されました。シートはその後、乾燥室（エスパンデ）へ運ばれ乾燥させられました。\",\n\"19世紀末、紙の需要増加と工場の増加により、ぼろ布が不足するようになり、新しい原料を見つける必要が生じました。さまざまな穀物の藁、さらには籾殻でも試験が行われましたが、最終的に、セルロースを豊富に含む木材パルプが優れた結果をもって布地の代替となることが分かりました。\\n木材パルプは19世紀半ばから紙の生産に用いられていましたが、この地域の工場は引き続き綿と亜麻のぼろ布を使用し、これに古紙を加えていました。\\n古紙を原料として使用した結果、新たな機械、「モイニョ・デ・ガルガス（ロール式粉砕機）」が登場し、紙の粉砕を容易にしました。\\nこのモイニョ・デ・ガルガスで、水を古紙に加え、二つの砥石で粉砕することによりパルプの生産が始まります。1時間後、この粉砕されたパルプは木製の水路を通ってオランダ式パルパーに運ばれ、同じ時間だけ精製されます。\\n精製後、得られたパルプは下部の水路を通じ、外側右側にある「マシャン」水車の水槽へと導かれます。\",\n\"水は常に紙の生産にとって不可欠な要素であり、製造工程においても、また水力エネルギーの動力源としても重要でした。このエネルギーは18世紀初頭から、サンタ・マリア・ダ・フェイラの製紙工場で利用されてきました。\\n20世紀初頭からは、水力は徐々にディーゼルおよび電気モーターに置き換えられましたが、河川の水量が水車を動かすのに十分であれば、水力は資源として使われ続けました。\\nクストディオ・パイス工場では、1952年頃に電力が導入され、製造工程の一部に電力が供給されるようになりました。外側左手をご覧ください。今日もリオ・マイオール川の水の力で動く大きな水車があります。反対側には、\\nオランダ式パルパーで精製された紙パルプを受け取る、マシャン水車の水槽があります。\\nこの珍しい古い緑色の電気制御盤は、モイニョ・デ・ガルガスとオランダ式パルパーを制御しています。後者は水力によっても駆動可能です。\",\n\"1920年以降、円網式抄紙機の導入により、ここで工業的に再生紙が生産されるようになりました。マシャン水車から集められたパルプは水路を通り、トレイ槽へと運ばれ、そこで不純物が濾過されます。流入するパルプの量は機械オペレーターによって管理され、\\nこれにより紙の坪量が決定されます。濾過後、パルプは「ティーナ」と呼ばれる第二の槽へと運ばれます。ティーナの中では、絶えず回転する円形の抄紙型が浮遊する繊維をすくい取り、紙のシートを形成します。紙のシートは羊毛のフェルトに押し当てられ、カレンダーロールへと運ばれ、\\nそこで余分な水分を取り除くために圧搾され、フェルトから分離されます。その後、機械オペレーターは紙を巻き取り機（一種のボビン）へと導き、そこで巻き取ります。巻き取り機は二つあるため、一方が紙で満杯になると、空のものと交換されます。\\nまだ湿った紙は裁断台に置かれ、ナイフで手作業により裁断されます。二つ折りにされて「ポスタス（束）」と呼ばれる紙の束が形成されます。これらは、乾燥のためにカーザ・ド・エスパンデへ運ばれるまで台のそばに置かれます。\\n廊下の突き当たりまで進み、左に曲がって最上階へ上がってください。\",\n\"カーザ・ド・エスパンデは紙の乾燥のための空間です。主に上層階に設けられ、これらの旧工場の中でも最も特徴的な空間の一つです。\\n現在の保護ガラスの奥に見えるように、壁は調節可能な木製の鎧戸で構成され、空気の循環を可能にして紙の乾燥を促進したり、直接の雨から空間を守ったりする役割を果たしていました。\\n「ボタデイラス」は、まだ湿った「グリーン」の紙の束を頭の上に載せ、機械室から乾燥室へ運んだ女性労働者たちです。\\n一つの束の重さは平均45キロにも及び、決して容易な作業ではありませんでした。乾燥室に到着すると、女性労働者たちは木製のフォークを使い、二つ折りにした紙のシートを「テザス」――木製の支柱に固定された針金からなる一種の物干しラック――に掛けて乾かしました。\\nこの作業は過酷でしたが、当時の条件や必要とされた労力を考えれば、乾燥室は陽気な場所でもあり、テザスに紙を掛ける作業に一定のリズムを刻む、ボタデイラスたちの歌声で満たされていました。\\n乾燥後、紙は回収され、最初の選別が行われ、破れた紙や不良品が取り除かれました。これらは再びリサイクルされました。この選別の後、紙はカーザ・ド・リシャドールへと運ばれました。\",\n\"カーザ・ド・リシャドールは道路と同じ高さに位置する広い空間です。工場敷地内で最も寒さと湿気の少ない場所です。カーザ・ド・エスパンデで乾燥した後、紙は製造工程の最終段階――仕上げと梱包――のためにここへ運ばれました。\\nここでは女性労働者たちが小さいサイズの紙を選び、「研磨」、つまり紙を滑らかにし、シートを数えました。\\n数え終えると、紙は半分に折られ、25枚からなる冊子、いわゆる紙の「マオン（手）」が形成されました。20「マオン」の束が1連（レズマ）を形成しました。\\n大きなサイズの紙はこの平滑化と計数の工程を経ることなく、単に十進秤で計量され、直接プレス機にかけられました。プレス機にかけられた紙は、シートを揃えるために槌で横から叩かれ、その後、紐や針金で結わえられて梱包（ファルド）が形成されました。\\n当初、梱包は100キロでしたが、その後50キロに、現在ではわずか25キロにまで減少しています。\\n準備が整うと、紙の梱包と連は、道路に通じる出入口を通じて外へ運び出され、牛車で、後にはトラックで、地元市場やポルト市の卸売業者へと輸送されました。\",\n\"20世紀初頭以降、サンタ・マリア・ダ・フェイラ地域および隣接するオヴァールなどの地域に、紙袋の生産を専門とする「サカリア」が数十軒誕生しました。\\nサカリアは主に「サケイラス」と呼ばれる女性たちが働く小規模な事業所で、「カルトゥショス」と呼ばれる紙袋を製造していました。裁断後、紙は定規の助けを借りて、サカリアの作業台に対角線状に広げられました。次に、\\n澱粉粉と水から作られた糊がブラシで紙に塗られました。その後、テーブルの天板に固定されたさまざまなサイズの袋型を使って、カルトゥショスが成形されました。袋ができあがると、糊を乾かすために乾燥機に入れられました。\\n一部のサカリアには、袋を装飾するための機械が備えられていることもありました。最も一般的だったのは「リスカデイラ」と呼ばれる機械で、マゼンタや青色の線を印刷していました。また、このミネルバ型のような小型の活版印刷機があり、製品や商店に関する情報の文字を印刷することもできました。\\n前世紀の1960年代以降、プラスチック産業の台頭により、古い紙のカルトゥショスは次第に取って代わられ、サカリアは徐々に衰退していきました。しかしながら、製品の継続的な改善と技術革新に力を入れる一部の企業は、今日でもなお全面的に操業を続け、さまざまな用途の梱包資材を生産しています。\\nそれでは部屋を出て、階段を下りてください。\",\n\"この展示エリアでは、ユーカリと松の木材を原料とする現代的な製紙工程についてご紹介します。\\n本展示は、自然の生息地にまだ生えている木から始まり、ポルトガルの紙製品の多様性と持続可能性で終わる変換プロセスを探る、順を追ったサブセクションで構成されています。\\nこの見学路では、森林の持続可能な管理と生物多様性の保護、ポルトガル本土における森林樹種の分布、紙の生産に用いられる繊維の種類、原材料が変化していく各段階、製造工程、さまざまな種類の紙とその特徴といったテーマが取り上げられています。\\nこのエリアの最後にあるマルチメディアキオスクにアクセスすると、ポルトガルでパルプ・紙生産を行う工場の情報、ユーカリ・グロブルスに関する豆知識、紙の生産について、そして紙や板紙の多用途性・応用性――そこから生まれる新たな日用素材や日用品――に関する補足情報をご覧いただけます。\",\n\"コンパクトボード（「パペラン」とも呼ばれる）は、梱包や箱に使われるより厚手の板紙です。その製造工程は紙のものと非常によく似ています。主な違いは製造機械の末端部分に現れます。紙とは異なり、この板紙は巻き取り機に巻かれることなく、\\n板状に切断され、乾燥するまで重ねて積み上げられます。かつて板紙の生産は季節性のもので、屋外で乾燥させるため、好天候に左右されていました。年月を経て、一部の企業はこの乾燥工程を早めるため、コンベアベルトを備えた温室のような設備を建設しました。乾燥後、\\n板紙は回収、選別され、ラミネート機で平滑化され、厚さごとに分類されました。25キロの束にまとめられました。束の側面には板紙の総枚数が表示されました。枚数が多い束ほど、より薄い板紙に対応していました。\",\n\"「透かし細工から透かし模様へ」は、この空間に誕生予定の展示エリアの名称で、この地域を最も代表する国内の透かし入り紙のコレクションを展示するものです。\\n透かし細工（フィリグラーナ）は、非常に細い金属線を用いて図案、文字、数字を形作る装飾的な工芸です。これらの図案は、製紙用の型を構成する金属網の表面に刺繍され、あるいは取り付けられます。逆光で見える紙の透かし模様は、この透かし細工の結果であり、\\n金属線の上では繊維の堆積が少なくなるため、より透明度の高い部分が生じるのです。\\nここでは、トマールにあったマトレナ製紙工場の古い透かし文様ロールをご紹介します。ポルトガル共和国を象徴する寓意的な透かし文様が施されています。ここでは近日中に、さらに新しい展示をご紹介する予定です。\\nさて、私たちの見学もそろそろ終わりに近づいています。\\nテラス・デ・サンタ・マリアにおける紙の世界を巡るこの旅を、お楽しみいただけましたら幸いです。\\n博物館の音声ガイド機器をご利用の場合は、受付までご返却ください。また、当館のショップにもぜひお立ち寄りいただき、この日の思い出をお持ち帰りください。\\nまだご存じでなければ、サンタ・マリア・ダ・フェイラ市にあるロイオス修道院博物館への訪問もおすすめいたします。ありがとうございました。またのご来館をお待ちしております。\",\n];\nconst ZH_NAMES = [\n\"圣玛丽亚达费拉造纸博物馆\",\n\"阿泽维多斯旧工厂\",\n\"下阿泽维多斯工厂遗址\",\n\"迈奥尔河\",\n\"库斯托迪奥·派斯旧工厂\",\n\"洛伦萨磨坊\",\n\"圆网机房\",\n\"水力系统\",\n\"机器房\",\n\"晾晒区\",\n\"打磨区\",\n\"纸袋作坊\",\n\"从森林到纸张\",\n\"密实纸板\",\n\"从暗纹到水印\",\n];\nconst ZH_BODIES = [\n\"圣玛丽亚·特拉斯造纸博物馆欢迎您的到来！\\n我们是一座致力于纸张历史的工业博物馆，我们的主要使命是保存造纸工人日常生活的记忆——这里是一个与造纸工业有着300多年历史渊源的地区。\\n事实上，本县第一家造纸厂于1708年在圣派奥·德奥莱罗斯教区成立。从那时起，造纸工艺便在整个县及邻近各县传播开来。这也正是设立一座致力于纸张历史的博物馆的理由。\\n博物馆位于帕苏斯·德布兰当，占据了两座旧工厂——库斯托迪奥·派斯工厂和阿泽维多斯工厂。这是一座充满活力、注重体验的博物馆，保留了工厂的氛围与造纸技艺的传承。常设展览\\\"从水车磨坊到工厂\\\"分布在不同区域，依照手工与工业制造工艺展开，讲述了这一地区纸张生产的历史。\\n时至今日，造纸业依然是本县最具代表性和最重要的经济活动之一。请随我们一起了解古老的圣玛丽亚地区造纸工业的历史。祝您参观愉快。\",\n\"这座建筑俗称\\\"上厂\\\"（Fábrica de Cima），曾是阿泽维多斯旧工厂的所在地，是圣玛丽亚达费拉县最重要的造纸单位之一。弗朗西斯科·若泽·德·阿泽维多·阿吉亚尔·布兰当是一位富有创新精神和远见的人物。他于1825年创立了这家\\\"书写纸工厂\\\"，这一名称见于当时的文献记载。\\n除生产包装纸外，该工厂的重点还在于书写纸、公文纸和薄纸的制造。其书写纸品质优异，1863年获得国王唐·路易斯一世颁发的铜质奖章。\\n这座旧工厂一直运营至1966年，如今仍保留着一台柴油发动机以及部分曾用于粉碎纸张的机器，供我们在此观察。\\n这间展厅巨大的岩石构造，是因为我们正处在一座过去曾被开采的旧花岗岩采石场之中。洪水泛滥时，迈奥尔河（Rio Maior）会漫过河岸，淹没建筑所依托的整片岩体。\\n请沿走廊前行，走出通往花园，再下行至遗址处。\",\n\"19世纪40年代，弗朗西斯科·若泽·德·阿泽维多在第一座工厂旁又建造了第二座造纸厂，后被称为\\\"下厂\\\"（Fábrica de Baixo）。\\n这座第二造纸单位一直运营至1954年10月24日——一个不幸载入史册的星期日，被称为\\\"水柱之日\\\"。当时暴雨引发迈奥尔河水位骤然上涨，造成部分住宅和造纸厂被摧毁，有些甚至完全损毁。\\n\\\"上厂\\\"的建筑在这场洪灾后的次年得以全面修复，但\\\"下厂\\\"却永远沦为废墟。\",\n\"迈奥尔河发源于圣玛丽亚达费拉县洛罗萨教区，最终注入位于埃斯皮尼奥县与奥瓦尔县之间的沿海泻湖——帕拉莫斯泻湖（埃斯莫里兹小海湾）。沿途河流会随所经之处或教区而更名，如拉马斯河、迈奥尔河、帕拉莫斯河等多种称呼。\\n这条河流不可通航，水量也不算丰沛，但当它进入帕苏斯·德布兰当教区、来到迈奥尔地区时，便呈现出另一番景象，形成天然与人工的堰坝。地势的显著落差与堰坝（也称\\\"prisas\\\"）使得水流可通过引水渠输送，从而利用水车实现能源利用。\\n迈奥尔河堪称\\\"纸河\\\"，因为从迈奥尔地区到帕拉莫斯泻湖，这条河曾服务过十四家造纸厂。\\n请继续前往下一栋建筑。\",\n\"库斯托迪奥·派斯工厂的历史可追溯至1822年10月26日，当时洛伦萨·平托与若阿金·德·卡瓦略签署了合伙协议。这是本县第六家造纸单位，也是唯一一家由女性担任创始合伙人的工厂。\\n洛伦萨磨坊（Engenho da Lourença）由两座旧面粉磨坊改建而成，最初只是一座简陋的小磨坊，逐张手工制作纸张。其生产依靠稀缺的家庭劳动力，运作也依赖迈奥尔河水量的充沛程度。\\n1827年，若阿金·德·卡瓦略在第一座磨坊旁又建立了一座新的造纸磨坊，当时这座磨坊已被称为洛伦萨磨坊。\\n这两座造纸磨坊于1916年被若泽·费雷拉·派斯收购，他将其合并为一家统一的造纸单位，并在多年后开始了连续造纸生产。\\n上世纪40年代，费雷拉·派斯家族在工厂建筑内建造了自己的住宅。\\n这家企业一直由同一家族经营，直至1989年才停止运营。\",\n\"洛伦萨·平托是圣玛丽亚地区第一位女性造纸企业家。尽管她目不识丁，其创业精神仍促使她于1822年与造纸大师若阿金·卡瓦略结为合伙人。两人共同建造了一座小磨坊，用于逐张手工制作纸张，并将洛伦萨·平托从母亲那里继承来的谷物磨坊加以改造利用。\\n过去，造纸所用的原材料是大麻、亚麻和棉布碎布，由拾荒者卖给造纸厂。这些碎布经过筛选和裁切台切割后，会在一台名为\\\"荷兰式打浆机\\\"的机器中被精细打磨，直至成为均匀细腻的纸浆。\\n随后，这些纸浆被放入生产槽中，配成20%纸浆与80%水的水溶液。借助一个抄纸帘（底部为金属网的木托盘），一名被称为\\\"laurente\\\"的工人收集悬浮的纤维，从而形成纸张。刚做好的纸张被倒扣在羊毛布——即毛毡上。\\n每张纸上再铺一层新毛毡，如此反复，直至形成一叠，随后进行压榨以去除多余水分。之后纸张被送往晾晒区（Espande）晾干。\",\n\"这里运转着将原材料转化为纸浆的机器。\\n19世纪末，随着纸张需求的增长和更多工厂的出现，破布变得稀缺，必须寻找新的原材料。人们尝试了各种谷物秸秆，甚至稻壳，直到发现富含纤维素的木浆能以极佳的效果替代布料。\\n尽管自19世纪中叶起木浆便已用于造纸，但本地区的工厂仍继续使用棉麻碎布，并加入废纸。\\n由于使用废纸作为原材料，出现了一种新机器——碎浆磨（moinho de galgas），使纸张的粉碎更为便利。\\n正是在碎浆磨中开始了纸浆的制作：将水加入废纸中，由两个磨石进行粉碎。一小时后，这些被粉碎的纸浆经由木制水槽输送至荷兰式打浆机，在那里再精细加工同样长的时间。\\n精炼之后，得到的纸浆通过下方水槽输送到位于室外右侧的\\\"maxão\\\"水轮水槽中。\",\n\"水一直是造纸生产中不可或缺的元素，无论是在制造过程中，还是作为产生水力能源的动力来源。这种能源自18世纪初起便被用于圣玛丽亚达费拉的造纸厂。自20世纪初起，水力逐渐被柴油发动机和电动机取代，但只要河水充足能够驱动水车，水力仍会作为一种资源被保留使用。\\n在库斯托迪奥·派斯工厂，电力大约于1952年引入，为部分制造工艺供能。请观察室外左侧那座至今仍由迈奥尔河水力驱动的大水轮。对面则是\\\"maxão\\\"水轮的水槽，用于接收在荷兰式打浆机中精炼过的纸浆。\\n那块奇特的旧式绿色电力控制板，控制着碎浆磨和荷兰式打浆机。后者也可由水力驱动。\",\n\"1920年起，由于购置了一台圆网造纸机，这里开始以工业方式生产再生纸。纸浆从\\\"maxão\\\"水轮处被收集，经水槽输送至托盘槽，杂质在此被过滤。进入的纸浆量由操作工人控制，从而决定纸张的克重。过滤后的纸浆被输送至第二个槽——称为\\\"缸\\\"（tina）。\\n在缸内，一个持续旋转的圆形抄纸网收集悬浮纤维，形成纸张。纸张被压在羊毛毛毡上，输送至压光辊，在此被压榨以去除多余水分，并与毛毡分离。随后，操作工人将纸张引导至卷纸轴（一种线轴），在此卷起。由于设有两个卷纸轴，当一个装满纸张时，会以空的一个替换。\\n仍潮湿的纸张被放在裁切台上，用刀手工裁切。将其对折两次，形成纸\\\"批\\\"（postas）。这些纸批留在裁切台旁，直到被运往晾晒区（Casa do Espande）晾干。\\n请走到走廊尽头，左转，上到顶楼。\",\n\"晾晒区是专门用于晾干纸张的空间。通常位于楼上，是这些旧工厂中最具特色的空间之一。\\n正如如今在防护玻璃后面所见，墙壁原本由可调节的木质百叶构成，用以促进空气流通、加速纸张干燥，或在下雨时保护空间不被雨水直接侵袭。\\n\\\"晾纸女工\\\"（Botadeiras）是负责将仍潮湿的\\\"绿\\\"纸批顶在头上，从机器房搬运到晾晒区的女工。\\n每批纸平均重达45公斤，因此绝非易事。到达晾晒区后，女工们借助一种木叉，将对折的纸张挂在\\\"tesas\\\"上晾干——那是一种带有固定金属丝、支撑于木架上的晾晒架。尽管这项工作十分艰辛，考虑到工作条件和所需的体力，\\n晾晒区却是充满欢乐的地方，回荡着晾纸女工的歌声，为悬挂纸张的工作赋予了稳定的节奏。\\n晾干后，纸张被收集并进行初步挑选，撕破或有瑕疵的纸张会被剔除，重新回收利用。经过这道挑选工序后，纸张被送往打磨区。\",\n\"打磨区是一处宽敞的空间，位于与道路齐平的一层，是整个工厂区域中最不寒冷、最不潮湿的地方。纸张在晾晒区干燥后，会被运至此处，进行制造工艺的最后一道工序——整理与包装。\\n在这里，女工们挑选小规格的纸张，进行\\\"打磨\\\"，也就是抚平，并清点纸张数量。\\n清点完毕后，纸张对折，形成一本25张的册子，称为一\\\"手\\\"纸。20\\\"手\\\"纸组成一\\\"令\\\"。\\n大规格的纸张不经过这道抚平和清点的工序，而是直接在十进制天平上称重，然后放入压力机。放入压力机后，纸张会被木槌从侧面敲打以对齐，再用绳子或铁丝捆扎，形成一\\\"包\\\"。最初每包重100公斤，后来减少到50公斤，如今每包仅重25公斤。\\n准备就绪后，成包的纸张与成令的纸张会被搬运到室外（通过通往道路的门），先用牛车运输，后来则用卡车，运往本地市场或波尔图城的批发商处。\",\n\"自20世纪初起，在圣玛丽亚达费拉县及奥瓦尔等邻近县，出现了数十家专门生产纸袋的作坊。\\n这些作坊是规模较小的企业，主要由被称为\\\"saqueiras\\\"的女工在此工作，生产被称为\\\"cartuchos\\\"的纸袋。纸张裁切后，借助一把直尺，被斜向铺在作坊的工作台上。随后，用刷子将由淀粉粉和水制成的胶水涂在纸上。\\n接着借助固定在台面上的各种尺寸的袋模，将纸袋成形。做好的纸袋被放入烘干处，以晾干胶水。\\n一些作坊可能配有用于个性化装饰纸袋的机器。最常见的是一种被称为\\\"riscadeira\\\"的划线机，可打印出洋红色或蓝色的线条。也可能配有小型印刷机，例如这台\\\"Minerva\\\"型印刷机，可印上有关产品或商店的文字信息。\\n自上世纪六十年代起，随着塑料工业的兴起，旧式纸袋逐渐被取代，导致纸袋作坊逐步衰落。然而，一些企业凭借对产品的持续改进和技术创新，至今仍在全面运营，生产用于各种用途的包装。\\n现在，请离开展厅，走下楼梯。\",\n\"在这一展区，我们将了解现代造纸工艺，该工艺以桉树和松树木材为原材料。\\n本展览按顺序呈现若干子展区，探索从仍处于自然生境中的树木开始，到葡萄牙纸制品多样性与可持续性结束的整个转化过程。\\n在此参观路线中，涉及的主题包括森林的可持续管理与生物多样性保护、葡萄牙大陆森林物种的分布、造纸所用纤维的种类、原材料转化的各个阶段、制造工艺以及不同类型纸张及其特性。\\n在本展区末尾，通过访问多媒体信息亭，您可以获取更多补充信息，包括葡萄牙从事纸浆和造纸生产的工厂名录、关于蓝桉的趣闻、关于造纸的知识，以及关于纸张和纸板多功能性与应用性的信息——由此衍生出许多日常生活中的新材料与新物品。\",\n\"密实纸板，也被称为\\\"papelão\\\"，是一种更厚的纸板，用于包装和箱子的制作。其制造工艺与纸张十分相似。主要区别体现在生产机器的末端：与纸张不同，纸板不会卷绕在卷纸轴上，而是被切割成板材，层层叠放，直至干燥。过去，\\n纸板的生产具有季节性，因为它需要露天晾晒，因而依赖有利的天气条件。多年来，一些企业建造了类似温室的结构，配备传送带，以加快这一干燥过程。干燥后，纸板会被收集、分拣，在压光机上抚平，并按厚度分组。以25公斤为单位捆扎成包。\\n包的侧面会标明纸板的总张数。张数越多的包对应的纸板越薄。\",\n\"\\\"从暗纹到水印\\\"是即将在此空间诞生的展区名称，将展示一批带有国家水印的纸张收藏，其中包括最能代表这一地区的作品。\\n暗纹（filigrana）是一种装饰工艺，使用非常纤细的金属丝来构成图案、字母和数字。这些图案随后被绣制或贴附在构成抄纸帘的金属网表面。透光可见的纸张水印，正是暗纹工艺的结果，因为在金属丝覆盖的区域纤维堆积较少，从而形成透明度更高的区域。\\n在此，我们特别展示一件来自托马尔（Tomar）已停业的马特雷纳造纸厂的水印雕刻辊，上面刻有象征葡萄牙共和国的寓意图案。我们将很快为您带来更多新展品。\\n目前，我们的参观即将结束。\\n希望您喜欢这次在圣玛丽亚地区纸张世界中的旅程。\\n如果您使用的是博物馆语音导览设备，请将其归还至前台。您也可以参观我们的商店，带走一份属于这一天的纪念品。\\n如果您还未参观过，我们建议您前往圣玛丽亚达费拉市的洛约斯修道院博物馆一游。感谢您，期待您的下次光临！\",\n];\nconst VIDEO_URLS = [\n\"\",\"\",\"\",\"\",\"\",\"\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-7.mp4\",\n\"\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-9.mp4\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-10.mp4\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-11.mp4\",\n\"\",\"\",\"\",\"\",\n];\nconst PHOTO_URLS = [\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-1.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-2.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-3.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-4.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-5.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-6.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-7.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-8.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-9.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-10.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-11.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-12.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-13.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-14.jpeg\",\n\"https://pub-67b8cca8e7b04c6b87092c3ca7a1e3f8.r2.dev/media/room-15.jpeg\",\n];\n\nconst ROOM_DATA = [\n  {name_pt:'Museu do Papel de Santa Maria da Feira', name_en:'Paper Museum of Santa Maria da Feira', name_de:'Papiermuseum von Santa Maria da Feira', name_fr:'Musée du Papier de Santa Maria da Feira', name_es:\"Museo del Papel de Santa Maria da Feira\", name_it:IT_NAMES[0], name_ja:JA_NAMES[0], ame_ja:JA_NAMES[7], name_zh:ZH_NAMES[7], name_nl:\"Het Hydraulisch Circuit\\n\"},\n  {name_pt:'Casa da máquina', name_en:'Machine House', name_de:'Maschinenhaus', name_fr:'Salle de la Machine', name_es:\"Casa de la Máquina\", name_it:IT_NAMES[8], name_ja:JA_NAMES[8], name_zh:ZH_NAMES[8], name_nl:\"Het Machinehuis\"},\n  {name_pt:'Casa do Espande', name_en:'Drying House', name_de:'Trockenhaus', name_fr:'Salle de Séchage', name_es:\"Casa del Secadero\", name_it:IT_NAMES[9], name_ja:JA_NAMES[9], name_zh:ZH_NAMES[9], name_nl:\"De Droogruimte\"},\n  {name_pt:'Casa do Lixador', name_en:'Sanding House', name_de:'Schleifhaus', name_fr:'Salle du Ponçage', name_es:\"Casa del Lijado\", name_it:IT_NAMES[10], name_ja:JA_NAMES[10], name_zh:ZH_NAMES[10], name_nl:\"De Schuurruimte\"},\n  {name_pt:'Sacaria', name_en:'Paper Bag Workshop', name_de:'Papiertütenwerkstatt', name_fr:'Atelier de Sacs en Papier', name_es:\"Taller de Bolsas de Papel\", name_it:IT_NAMES[11], name_ja:JA_NAMES[11], name_zh:ZH_NAMES[11], name_nl:\"De Papieren Zakken Werkplaats\"},\n  {name_pt:'Da floresta ao papel', name_en:'From Forest to Paper', name_de:'Vom Wald zum Papier', name_fr:'De la Forêt au Papier', name_es:\"Del Bosque al Papel\", name_it:IT_NAMES[12], name_ja:JA_NAMES[12], name_zh:ZH_NAMES[12], name_nl:\"Van Bos tot Papier\"},\n  {name_pt:'Cartão compacto', name_en:'Solid Board', name_de:'Vollpappe', name_fr:'Carton Compact', name_es:\"Cartón Compacto\", name_it:IT_NAMES[13], name_ja:JA_NAMES[13], name_zh:ZH_NAMES[13], name_nl:\"Massief Karton\"},\n  {name_pt:'Da filigrana à marca de água', name_en:'From Filigree to Watermark', name_de:'Vom Filigran zum Wasserzeichen', name_fr:'De la Filigrane au Filigrane Aquatique', name_es:\"De la Filigrana a la Marca de Agua\", name_it:IT_NAMES[14], name_ja:JA_NAMES[14], name_zh:ZH_NAMES[14], name_nl:\"Van Filigraan tot Watermerk\"},\n];\n\nconst PT_BODIES = [\n\"O Museu do Papel Terras de Santa Maria dá-lhe as boas-vindas!\\nSomos um museu industrial dedicado à história do papel e a nossa principal missão é preservar memórias do quotidiano papeleiro, numa região com mais de 300 anos de história ligada à indústria do papel.\\nDe facto, a primeira fábrica de papel do concelho foi fundada em 1708 na freguesia de São Paio de Oleiros. A partir daí a arte de fazer papel difundiu-se por todo o concelho e pelos concelhos vizinhos. Justifica-se por isso a criação de um museu dedicado à história do papel.\\nLocalizado em Paços de Brandão, o museu ocupa duas antigas fábricas, a Fábrica Custódio Pais e a Fábrica dos Azevedos. Este é um museu vivo e experiencial que preservou o ambiente fabril e o \\\"saber-fazer\\\" da arte de fabricar papel. A exposição permanente \\\"Do Engenho à Fábrica\\\" desenvolve-se por diferentes áreas, de acordo com os processos de fabrico manual e industrial, contando a história da produção de papel nesta região.\\nAinda hoje é uma das mais representativas e importantes atividades económicas do concelho. Venha connosco conhecer a história da indústria papeleira na antiga Terra de Santa Maria. Desejamos-lhe uma ótima visita.\",\n\"Popularmente conhecida como Fábrica de Cima, neste edifício funcionou a antiga Fábrica dos Azevedos, uma das mais importantes unidades papeleiras do concelho de Santa Maria da Feira. Francisco José de Azevedo Aguiar Brandão foi um homem inovador e visionário. Fundou em 1825 esta \\\"Fábrica de Papel de Escrever\\\", como é referida na documentação da época.\\nAlém do fabrico de papel de embalagem, a grande aposta desta unidade foi a manufatura de papel de escrever, almaço e florete. A excelente qualidade do seu papel de escrita foi distinguida em 1863 com uma medalha de cobre atribuída pelo rei D. Luís I.\\nDesta antiga fábrica, que se manteve em atividade até 1966, foi possível conservar um motor a diesel e parte da máquina utilizada na trituração de papel, que aqui podemos observar.\\nA enorme formação rochosa desta sala deve-se ao facto de nos encontrarmos numa antiga pedreira de granito explorada no passado. Em dias de cheia, o Rio Maior galga as suas margens, cobrindo toda a massa rochosa em que assenta o edifício.\\nSiga pelo corredor, saia para o jardim e desça até às ruínas.\",\n\"Nos anos 40 do século 19, Francisco José de Azevedo edifica uma segunda fábrica de papel, adjacente à primeira, que ficou conhecida como Fábrica de Baixo.\\nEsta segunda unidade papeleira laborou até ao dia 24 de Outubro de 1954, um domingo que ficou tristemente para a história como o \\\"dia da tromba de água\\\". Chuvas intensas provocaram uma subida repentina das águas do Rio Maior, resultando na destruição parcial e em alguns casos total, de habitações e fábricas de papel.\\nOs edifícios da Fábrica de Cima foram completamente recuperados no ano seguinte a esta tromba de água, mas a Fábrica de Baixo permaneceu para sempre em ruínas.\",\n\"O Rio Maior nasce na freguesia de Lourosa, concelho de Santa Maria da Feira, indo desaguar à Lagoa de Paramos, Barrinha de Esmoriz, uma lagoa costeira situada entre os concelhos de Espinho e Ovar. Ao longo do seu percurso vai recebendo o nome dos lugares ou freguesias que atravessa, como Rio de Lamas, Rio Maior, Rio de Paramos, entre outras designações.\\nEste rio não é navegável nem apresenta um caudal abundante, mas entrando na freguesia de Paços de Brandão, no Lugar de Rio Maior, ganha outra dimensão criando açudes naturais e artificiais. Os desníveis acentuados de terreno e os açudes, também chamados de presas, permitem conduzir a água através de levadas, possibilitando o aproveitamento energético que resulta da ação das rodas hidráulicas.\\nO Rio Maior poderia chamar-se rio do papel pois do Lugar de Rio Maior à Lagoa de Paramos, servia no passado, catorze fábricas de papel.\\nContinue o percurso até ao edifício seguinte.\",\n\"A história da Fábrica Custódio Pais remonta a 26 de Outubro de 1822, quando Lourença Pinto e Joaquim de Carvalho celebraram a sua escritura de sociedade. Foi a 6ª unidade papeleira do concelho, mas a única que teve uma mulher como sócia-fundadora.\\nConstruído a partir de dois antigos moinhos de farinha, o Engenho da Lourença começou por ser um pequeno e rudimentar moinho que fabricava papel folha a folha. A sua produção assentava em mão-de-obra escassa e familiar e o seu funcionamento dependia da abundância das águas do Rio Maior.\\nEm 1827 Joaquim de Carvalho fundou um novo moinho de papel, junto ao primeiro engenho que já então era conhecido como o Engenho da Lourença.\\nEstes dois engenhos de papel viriam a ser adquiridos em 1916 por José Ferreira Pais que os transforma numa única unidade papeleira, iniciando, anos mais tarde, a produção de papel em contínuo.\\nNa década de 40 do século passado, a família Ferreira Pais edifica a sua habitação no edifício da fábrica.\\nEsta empresa manteve-se em atividade, sempre na mesma família, até 1989.\",\n\"Lourença Pinto foi a primeira mulher empresária do papel em Terras de Santa Maria. Embora analfabeta, o seu espírito empreendedor levou-a a associar-se em 1822 ao mestre papeleiro Joaquim Carvalho. Ambos construíram um pequeno engenho para produção artesanal de papel folha a folha, adaptando uns moinhos de cereal que Lourença Pinto havia herdado de sua mãe.\\nNo passado, a matéria-prima utilizada no fabrico de papel era constituída por trapos de cânhamo, de linho e de algodão, vendidos às fábricas de papel pelos farrapeiros. Estes trapos, depois de escolhidos na ciranda e cortados na mesa da tesoura do trapo, eram refinados numa máquina chamada pila holandesa, até se conseguir uma pasta homogénea e muito fina.\\nEm seguida essa pasta era colocada na tina de produção, numa solução aquosa composta por 20% de pasta e 80% de água. Com a ajuda de uma fôrma (tabuleiro de madeira com fundo em teia metálica), um operário, designado de laurente, recolhia as fibras em suspensão, formando assim a folha de papel. A folha acabada de fazer era desenformada sobre um tecido de lã, a baeta ou burel. Sobre cada folha era colocada uma nova baeta, repetindo-se o processo até se obter uma pilha que, de seguida, era prensada para eliminar o excesso de água. As folhas eram então postas a secar no Espande.\",\n\"É aqui que funcionam as máquinas que transformam a matéria-prima em pasta de papel. No final do século 19, com o aumento da procura de papel e o aparecimento de mais fábricas, o trapo torna-se escasso sendo preciso encontrar novas matérias-primas. Foram feitas várias experiências com palha de diferentes cereais, e até com casca de arroz, até que se percebeu que a pasta de madeira, rica em celulose, poderia substituir o tecido com excelentes resultados. Apesar de, desde meados do século 19, a pasta de madeira ter sido utilizada para a produção de papel, as fábricas da nossa região continuaram a usar trapos de algodão e de linho aos quais adicionavam papel usado. Em consequência do uso de papel velho como matéria-prima, surge uma nova máquina, o moinho de galgas, que veio facilitar a trituração do papel.\\nÉ no moinho de galgas que se passa a produzir a pasta, juntando água ao papel usado, triturado por duas mós. Ao fim de 1 hora, essa pasta triturada segue por um canal de madeira até à pila holandesa, onde era refinada por igual período.\\nDepois de refinada, a pasta resultante é conduzida por um canal inferior para o tanque da roda do maxão localizado no exterior, à direita.\",\n\"A água sempre foi um elemento fundamental para a produção de papel, quer durante o seu processo de fabrico, quer como força motriz na produção de energia hidráulica. Esta energia foi utilizada nas fábricas de papel de Santa Maria da Feira, desde o início do século 18. A partir do início do século 20 a energia hidráulica foi sendo gradualmente substituída por motores a diesel e elétricos, mantendo-se, no entanto, como um recurso, sempre que a água do rio era suficiente para acionar a roda hidráulica.\\nNa Fábrica Custódio Pais, a energia elétrica chegou por volta de 1952, passando a alimentar parte do processo de fabrico. Observe no exterior, do lado esquerdo, a grande roda que ainda hoje é acionada pela força das águas do Rio Maior. No lado oposto localiza-se o tanque da roda do maxão, que recebe a pasta de papel que foi refinada na pila holandesa.\\nO curioso e antigo quadro elétrico de cor verde, controla o moinho de galgas e a pila holandesa. Esta última pode também ser acionada por energia hidráulica.\",\n\"A partir de 1920 começa a produzir-se aqui papel reciclado de modo industrial, graças à aquisição de uma máquina de fôrma redonda. A partir da roda do maxão, a pasta é recolhida e encaminhada por uma caleira até chegar ao tanque de tabuleiros onde as impurezas são filtradas. A quantidade de pasta que entra é controlada pelo maquinista, determinando-se assim a gramagem do papel. Depois de filtrada, a pasta é encaminhada para um segundo tanque chamado tina. Dentro da tina, uma fôrma redonda em constante rotação recolhe as fibras em suspensão, formando-se a folha de papel. A folha de papel é pressionada contra a baeta de lã, e transportada até aos rolos da calandra, onde é prensada para libertar o excesso de água, separando-se da baeta. De seguida, o maquinista encaminha o papel para o sarilho, uma espécie de bobine, onde é enrolado. Como existem dois sarilhos, quando um fica carregado de papel é substituído pelo vazio.\\nO papel ainda húmido é colocado sobre a mesa de corte onde é cortado à mão com uma faca. É dobrado duas vezes para formar as postas de papel. Estas ficam junto à mesa até serem transportadas para a Casa do Espande onde são postas a secar.\\nSiga até ao fim do corredor, vire à esquerda e suba até ao último andar.\",\n\"A Casa do Espande é o local destinado à secagem do papel. Localizado preferencialmente nos pisos superiores, é um dos espaços mais característicos destas antigas fábricas. Como se pode ver por trás dos atuais vidros de proteção, as paredes eram formadas por persianas de madeira, reguláveis, para permitir a circulação do ar e acelerar a secagem do papel, ou proteger o espaço da entrada direta da chuva.\\nAs Botadeiras eram as operárias que carregavam à cabeça as postas de papel \\\"verde\\\", ainda húmido, desde a Casa da Máquina até ao Espande. Cada posta pesava em média 45 quilos, não sendo por isso uma tarefa fácil. Já no Espande, com a ajuda de uma cruzeta, as operárias \\\"botavam\\\" a secar as folhas de papel dobradas a meio, nas tesas, uma espécie de estendais com arames fixos em suportes de madeira. Apesar da dureza deste trabalho, face às condições e ao esforço realizado, os espandes eram locais alegres, preenchidos pelo cantar das botadeiras que imprimia um ritmo certo ao trabalho de botar o papel nas tesas.\\nApós a secagem, o papel era recolhido e sujeito a uma primeira seleção, sendo retiradas as folhas rasgadas ou com defeito. Estas seriam novamente recicladas. Após esta escolha, o papel era levado para a Casa do Lixador.\",\n\"A Casa do Lixador é um espaço amplo, situado ao nível da estrada. É o local menos frio e húmido de todo o espaço fabril. Depois de seco na Casa do Espande, o papel era transportado para aqui para a última fase do processo de fabrico – os acabamentos e a embalagem.\\nAqui as operárias escolhiam o papel de pequena dimensão, \\\"lixavam\\\", ou seja, alisavam o papel, e contavam as folhas. Depois de contado, o papel era dobrado ao meio, formando um caderno de 25 folhas, designado por \\\"mão\\\" de papel. O conjunto de 20 \\\"mãos\\\" formava uma resma.\\nO papel de grande dimensão não passava por este processo de alisamento e contagem, sendo somente pesado na balança decimal e colocado diretamente na prensa. Já na prensa, o papel era batido lateralmente com um maço para alinhar as folhas, que eram atadas com corda ou arame, formando um fardo. Inicialmente, os fardos eram de 100kg, tendo reduzido para 50kg, sendo hoje somente de 25kg.\\nUma vez prontos, os fardos e as resmas de papel eram carregados para o exterior (pela porta de acesso à estrada), sendo transportados em carros de bois, e mais tarde em camionetas, para o mercado local ou para os armazenistas da cidade do Porto.\",\n\"A partir do início do século 20, no concelho de Santa Maria da Feira e nos concelhos vizinhos como o de Ovar, surgiram dezenas de Sacarias dedicadas à produção de sacos de papel. As Sacarias eram pequenas empresas onde trabalhavam essencialmente mulheres - as saqueiras - que produziam sacos de papel chamados cartuchos. Depois de cortado, o papel era estendido sobre a mesa da sacaria, na diagonal, com a ajuda de um arreador. Seguidamente, a cola, que era feita à base de farinha de amido e água, era aplicada no papel com uma escova. Os cartuchos eram então moldados com recurso a fôrmas de saco de diversos tamanhos, que se encontram fixas ao tampo da mesa. Feitos os sacos, eram colocados nos secadores, para secar a cola.\\nEm algumas sacarias, podiam existir máquinas para personalizar o saco. A mais comum era a riscadeira, que imprimia linhas de cor magenta ou azul. Podiam também existir pequenas máquinas de tipografia, como esta do tipo Minerva, que imprimia texto com informação sobre o produto ou sobre o estabelecimento comercial.\\nA partir da década de sessenta do século passado, com a afirmação da indústria dos plásticos, os velhos cartuchos de papel foram sendo substituídos, provocando a decadência progressiva das sacarias. No entanto, algumas empresas, apostando na melhoria constante do produto e na inovação tecnológica, ainda hoje se encontram em plena laboração, produzindo embalagens para diversos fins.\\nSaia agora da sala e desça as escadas.\",\n\"Neste núcleo expositivo vamos conhecer o moderno processo de fabrico do papel, que utiliza como matéria-prima a madeira de eucalipto e a madeira de pinheiro.\\nEsta exposição apresenta subnúcleos sequenciais que exploram o processo de transformação que começa na árvore, ainda inserida no seu habitat natural, e termina na diversidade e sustentabilidade dos produtos papeleiros portugueses.\\nAo longo deste percurso, são abordados temas como a gestão sustentável da floresta e a proteção da biodiversidade, a distribuição de espécies florestais em Portugal continental, tipos de fibras utilizados na produção de papel, as diferentes fases de transformação da matéria-prima, o processo de fabrico e diferentes tipos de papel e suas características.\\nNo final deste núcleo, ao aceder ao quiosque multimédia, tem acesso a informação complementar, nomeadamente, identificação de fábricas que se dedicam à produção de pasta e papel em Portugal, curiosidades sobre o eucalipto globulus, sobre a produção do papel e sobre a versatilidade e aplicabilidade do papel e do cartão, dos quais resultam novos suportes e objetos do quotidiano.\",\n\"O cartão compacto, designado também por papelão, é um cartão mais espesso usado para embalagens e caixas. O seu processo de fabrico é muito semelhante ao do papel. A principal diferença verifica-se no terminal da máquina de produção, momento em que o cartão, ao contrário do papel, não enrola no sarilho sendo antes cortado em placas, colocadas umas sobre as outras, até ao momento de secagem. No passado, o cartão era de produção sazonal, pois secava ao ar livre, dependendo por isso de condições climatéricas favoráveis. Com o passar dos anos, algumas empresas construíram uma espécie de estufa, com tapetes rolantes, para acelerar este processo de secagem. Depois de seco, o cartão era recolhido, selecionado, alisado na laminadora e agrupado de acordo com a respetiva espessura. Era atado em maços de 25 kg. Na lateral do maço era identificado o número total de folhas de cartão. Maços com mais folhas correspondiam a cartão mais fino.\",\n\"\\\"Da Filigrana à marca de água\\\" é o nome do núcleo expositivo que irá nascer neste espaço, com a apresentação de uma coleção de papéis com marcas de água nacionais, e mais representativas deste território. A filigrana é um trabalho ornamental que utiliza fios metálicos muito finos para formar figuras, letras e números. Por sua vez, estas figuras são bordadas ou aplicadas na superfície da teia metálica que compõe a fôrma de fazer papel. A marca de água do papel que é visível em contraluz é o resultado da filigrana, pois sobre os fios metálicos teremos uma menor acumulação de fibras, ocasionando áreas de maior transparência.\\nDestacamos aqui um rolo filigranador da antiga Fábrica de Papel da Matrena, em Tomar, que ostenta uma filigrana alegórica à República Portuguesa. Teremos mais novidades para lhe apresentar aqui em breve.\\nPor agora, a nossa visita está prestes a terminar. Desejamos que tenha apreciado esta viagem pelo mundo do papel em Terras de Santa Maria.\\nSe está a usar um áudio guia do museu, pedimos por favor que o devolva na receção. Poderá ainda visitar a nossa loja e levar consigo uma recordação deste dia.\\nSe ainda não conhece, sugerimos uma visita ao Museu Convento dos Lóios, na cidade de Santa Maria da Feira. Obrigada e até uma próxima visita!\",\n];\nconst EN_BODIES = [\n\"The Museu do Papel Terras de Santa Maria welcomes you! We are an industrial museum dedicated to the history of paper, and our main mission is to preserve the everyday memories of papermaking in a region with over 300 years of history tied to the paper industry.\\nIndeed, the county's first paper mill was founded in 1708 in the parish of São Paio de Oleiros. From there, the craft of papermaking spread throughout the county and neighbouring counties. This justifies the creation of a museum dedicated to the history of paper.\\nLocated in Paços de Brandão, the museum occupies two former factories, the Custódio Pais Factory and the Azevedos Factory. This is a living, experiential museum that has preserved the factory atmosphere and the know-how of the art of papermaking. The permanent exhibition \\\"From Mill to Factory\\\" unfolds across different areas, following the manual and industrial manufacturing processes, telling the story of paper production in this region.\\nEven today it remains one of the county's most representative and important economic activities. Join us to discover the history of the paper industry in the old Terra de Santa Maria. We wish you a wonderful visit.\",\n\"Popularly known as the Upper Factory (Fábrica de Cima), this building housed the former Azevedos Factory, one of the most important paper-making units in the county of Santa Maria da Feira. Francisco José de Azevedo Aguiar Brandão was an innovative and visionary man. In 1825 he founded this \\\"Writing Paper Factory,\\\" as it is referred to in documents of the time.\\nBesides producing packaging paper, this unit's main focus was manufacturing writing, ledger and vellum paper. The excellent quality of its writing paper was recognised in 1863 with a bronze medal awarded by King D. Luís I.\\nFrom this former factory, which remained active until 1966, it was possible to preserve a diesel engine and part of the machine used for shredding paper, which we can observe here.\\nThe huge rock formation in this room exists because we are standing in a former granite quarry that was once worked. During floods, the Rio Maior overflows its banks, covering the entire rocky mass on which the building rests.\\nFollow the corridor, go out to the garden and go down to the ruins.\",\n\"In the 1840s, Francisco José de Azevedo built a second paper mill, adjacent to the first, which became known as the Lower Factory (Fábrica de Baixo).\\nThis second papermaking unit operated until 24 October 1954, a Sunday sadly remembered in local history as the \\\"day of the water spout.\\\" Intense rains caused a sudden rise in the waters of the Rio Maior, resulting in the partial, and in some cases total, destruction of homes and paper mills.\\nThe buildings of the Upper Factory were fully restored the following year, but the Lower Factory remained in ruins forever.\",\n\"The Rio Maior rises in the parish of Lourosa, in the county of Santa Maria da Feira, and flows into the Paramos Lagoon (Barrinha de Esmoriz), a coastal lagoon located between the counties of Espinho and Ovar. Along its course it takes the name of the places or parishes it passes through, such as Rio de Lamas, Rio Maior, and Rio de Paramos, among other designations.\\nThis river is not navigable and does not carry an abundant flow, but on entering the parish of Paços de Brandão, in the area known as Rio Maior, it takes on a different scale, forming natural and artificial weirs. The steep changes in terrain and the weirs, also called \\\"presas,\\\" allowed water to be channelled through mill races, enabling the energy harnessed from waterwheels.\\nThe Rio Maior could well be called the \\\"paper river,\\\" since from the Rio Maior area to the Paramos Lagoon it once served fourteen paper mills.\\nContinue the route to the next building.\",\n\"The history of the Custódio Pais Factory dates back to 26 October 1822, when Lourença Pinto and Joaquim de Carvalho signed their partnership deed. It was the county's 6th papermaking unit, but the only one to have a woman as a founding partner.\\nBuilt from two old flour mills, the Engenho da Lourença began as a small, rudimentary mill that produced paper sheet by sheet. Its output relied on scarce, family labour, and its operation depended on the abundance of the Rio Maior's waters.\\nIn 1827 Joaquim de Carvalho founded a new paper mill next to the first one, which by then was already known as the Engenho da Lourença.\\nThese two paper mills were acquired in 1916 by José Ferreira Pais, who merged them into a single papermaking unit, later beginning continuous paper production.\\nIn the 1940s, the Ferreira Pais family built their home within the factory building.\\nThis company remained active, always within the same family, until 1989.\",\n\"Lourença Pinto was the first woman paper entrepreneur in the Terras de Santa Maria. Although illiterate, her entrepreneurial spirit led her to partner in 1822 with master papermaker Joaquim Carvalho. Together they built a small mill for the handmade production of paper sheet by sheet, adapting some grain mills that Lourença Pinto had inherited from her mother.\\nIn the past, the raw material used in papermaking consisted of hemp, linen and cotton rags, sold to the paper mills by rag collectors. These rags, after being sorted on the cleaning sieve and cut on the rag-cutting table, were refined in a machine called a Hollander beater, until a homogeneous, very fine pulp was obtained.\\nThis pulp was then placed in the vat, in a water-based solution made of 20% pulp and 80% water. With the help of a mould (a wooden tray with a metal mesh base), a worker known as the \\\"laurente\\\" gathered the suspended fibres, thus forming the sheet of paper. The freshly made sheet was turned out onto a woollen cloth, the \\\"baeta\\\" or felt. A new felt was placed over each sheet, repeating the process until a stack was formed, which was then pressed to remove excess water. The sheets were then set to dry in the Espande (drying loft).\",\n\"This is where the machines that transform raw material into paper pulp operate.\\nAt the end of the 19th century, with rising demand for paper and the appearance of more factories, rags became scarce, and new raw materials had to be found. Various experiments were made with straw from different cereals, and even with rice husk, until it was discovered that wood pulp, rich in cellulose, could replace cloth with excellent results.\\nAlthough wood pulp had been used for paper production since the mid-19th century, the factories in our region continued to use cotton and linen rags, to which they added used paper.\\nAs a result of using old paper as raw material, a new machine appeared: the \\\"moinho de galgas\\\" (rag/roller mill), which made shredding paper easier.\\nIt is in the moinho de galgas that pulp production begins, adding water to the used paper, which is shredded by two millstones. After 1 hour, this shredded pulp travels along a wooden channel to the Hollander beater, where it is refined for an equal period.\\nOnce refined, the resulting pulp is carried through a lower channel to the tank of the \\\"maxão\\\" wheel, located outside, to the right.\",\n\"Water has always been a fundamental element in paper production, both during the manufacturing process and as a driving force for generating hydraulic power. This energy was used in the paper mills of Santa Maria da Feira from the early 18th century onwards. From the early 20th century, hydraulic power was gradually replaced by diesel and electric motors, though it remained in use whenever the river's water was sufficient to drive the waterwheel.\\nAt the Custódio Pais Factory, electric power arrived around 1952, powering part of the manufacturing process. Look outside, on the left, at the large wheel still driven today by the force of the Rio Maior's waters. On the opposite side is the tank of the \\\"maxão\\\" wheel, which receives the paper pulp refined in the Hollander beater.\\nThe curious old green electrical panel controls the moinho de galgas and the Hollander beater. The latter can also be driven by hydraulic power.\",\n\"From 1920 onwards, recycled paper began to be produced here industrially, thanks to the acquisition of a round-mould machine. From the \\\"maxão\\\" wheel, the pulp is collected and carried along a channel to the tray tank, where impurities are filtered out. The amount of pulp entering is controlled by the machine operator, thereby determining the paper's weight (grammage). Once filtered, the pulp is carried to a second tank called the \\\"tina\\\" (vat). Inside the vat, a constantly rotating round mould gathers the suspended fibres, forming the sheet of paper. The sheet of paper is pressed against the woollen felt and carried to the calender rollers, where it is pressed to remove excess water, separating from the felt. The machine operator then guides the paper to the reel, a kind of bobbin, where it is wound up. Since there are
