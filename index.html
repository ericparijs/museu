 two reels, when one is full of paper it is replaced by the empty one.\\nThe still-damp paper is placed on the cutting table, where it is cut by hand with a knife. It is folded twice to form the \\\"postas\\\" (bundles) of paper. These remain by the table until they are carried to the Casa do Espande, where they are set to dry.\\nContinue to the end of the corridor, turn left and go up to the top floor.\",\n\"The Casa do Espande is the space dedicated to drying the paper. Usually located on the upper floors, it is one of the most characteristic spaces in these old factories.\\nAs can be seen behind the current protective glass, the walls were made up of adjustable wooden shutters, allowing air to circulate and speed up the drying of the paper, or protecting the space from direct rain.\\nThe \\\"Botadeiras\\\" were the women workers who carried the still-damp \\\"green\\\" paper bundles on their heads, from the Casa da Máquina to the Espande.\\nEach bundle weighed about 45 kilos, making it no easy task. Once in the Espande, with the help of a wooden fork (\\\"cruzeta\\\"), the workers \\\"hung\\\" the sheets of paper, folded in half, to dry on the \\\"tesas,\\\" a kind of drying rack with fixed wires held by wooden supports. Despite the harshness of this work, given the conditions and effort involved, the drying lofts were cheerful places, filled with the singing of the botadeiras, which set a steady rhythm for the work of hanging the paper on the tesas.\\nAfter drying, the paper was collected and underwent a first selection, removing torn or defective sheets. These would be recycled again. After this selection, the paper was taken to the Casa do Lixador.\",\n\"The Casa do Lixador is a large space, located at street level. It is the least cold and damp place in the entire factory complex. After drying in the Casa do Espande, the paper was brought here for the final stage of the manufacturing process — finishing and packaging.\\nHere, the women workers selected the smaller-sized paper, \\\"sanded,\\\" meaning smoothed, the paper, and counted the sheets.\\nOnce counted, the paper was folded in half, forming a notebook of 25 sheets, called a \\\"mão\\\" (hand) of paper. A set of 20 \\\"mãos\\\" formed a ream.\\nLarger-sized paper did not go through this smoothing and counting process; it was simply weighed on the decimal scale and placed directly in the press. Once in the press, the paper was struck sideways with a mallet to align the sheets, which were then tied with rope or wire, forming a bale. Bales were initially 100 kg, later reduced to 50 kg, and today weigh only 25 kg.\\nOnce ready, the bales and reams of paper were loaded outside (through the door leading to the road) and transported by ox carts, and later by trucks, to the local market or to wholesalers in the city of Porto.\",\n\"From the early 20th century onwards, dozens of \\\"Sacarias\\\" dedicated to producing paper bags emerged in the county of Santa Maria da Feira and neighbouring counties such as Ovar.\\nThe Sacarias were small businesses where mostly women — the \\\"saqueiras\\\" — worked, producing paper bags known as \\\"cartuchos.\\\" After being cut, the paper was laid out diagonally on the sacaria table with the help of a straightedge (\\\"arreador\\\"). Next, glue made from starch flour and water was applied to the paper with a brush. The cartuchos were then shaped using bag moulds of various sizes, fixed to the tabletop. Once made, the bags were placed in dryers to dry the glue.\\nSome sacarias might have machines to personalise the bags. The most common was the \\\"riscadeira,\\\" which printed lines in magenta or blue. There might also be small typography machines, such as this Minerva-type press, which printed text with information about the product or the business.\\nFrom the 1960s onwards, with the rise of the plastics industry, the old paper cartuchos were gradually replaced, leading to the progressive decline of the sacarias. However, some companies, betting on constant product improvement and technological innovation, are still fully operational today, producing packaging for various purposes.\\nNow leave the room and go down the stairs.\",\n\"In this exhibition area, we will learn about the modern papermaking process, which uses eucalyptus and pine wood as raw material.\\nThis exhibition presents sequential sub-sections that explore the transformation process, beginning with the tree, still within its natural habitat, and ending with the diversity and sustainability of Portuguese paper products.\\nAlong this route, topics addressed include the sustainable management of forests and the protection of biodiversity, the distribution of forest species in mainland Portugal, the types of fibres used in paper production, the different stages of raw material transformation, the manufacturing process, and different types of paper and their characteristics.\\nAt the end of this section, by accessing the multimedia kiosk, you can access further information, including the identification of factories dedicated to pulp and paper production in Portugal, curiosities about eucalyptus globulus, about paper production, and about the versatility and applicability of paper and cardboard, from which new everyday materials and objects are made.\",\n\"Solid board, also known as \\\"papelão,\\\" is a thicker board used for packaging and boxes. Its manufacturing process is very similar to that of paper. The main difference occurs at the end of the production machine, when the board, unlike paper, is not wound onto a reel but is instead cut into sheets, stacked on top of one another, until drying time. In the past, board production was seasonal, as it dried outdoors, depending on favourable weather conditions. Over the years, some companies built a kind of greenhouse, with conveyor belts, to speed up this drying process. Once dry, the board was collected, sorted, smoothed on the laminator, and grouped according to thickness. It was tied into bundles of 25 kg. The total number of board sheets was marked on the side of the bundle. Bundles with more sheets corresponded to thinner board.\",\n\"\\\"From Filigree to Watermark\\\" is the name of the exhibition area to be created in this space, presenting a collection of papers with national watermarks, among the most representative of this region.\\nFiligree is ornamental work that uses very fine metal wires to form figures, letters and numbers. These figures are, in turn, embroidered or applied onto the surface of the metal mesh that makes up the papermaking mould. The paper's watermark, visible against the light, results from the filigree, since over the metal wires there is a lower accumulation of fibres, creating areas of greater transparency.\\nHere we highlight a watermarking roller from the former Matrena Paper Factory in Tomar, bearing a filigree allegorical to the Portuguese Republic. We will have more novelties to present here soon.\\nFor now, our visit is coming to an end.\\nWe hope you have enjoyed this journey through the world of paper in the Terras de Santa Maria.\\nIf you are using a museum audio guide, please return it at reception. You are also welcome to visit our shop and take home a memento of this day.\\nIf you haven't yet, we suggest a visit to the Museu Convento dos Lóios, in the city of Santa Maria da Feira. Thank you, and until next time!\",\n];\n\nconst DE_BODIES = [\n\"Das Museu do Papel Terras de Santa Maria heißt Sie willkommen!\\nWir sind ein Industriemuseum, das der Geschichte des Papiers gewidmet ist, und unsere Hauptaufgabe ist es, die Erinnerungen an den Alltag der Papiermacher zu bewahren – in einer Region mit über 300 Jahren Geschichte, die mit der Papierindustrie verbunden ist.\\nTatsächlich wurde die erste Papierfabrik des Landkreises 1708 in der Gemeinde São Paio de Oleiros gegründet. Von dort aus verbreitete sich die Kunst der Papierherstellung im gesamten Landkreis und in den benachbarten Gemeinden. Dies rechtfertigt die Einrichtung eines Museums, das der Geschichte des Papiers gewidmet ist.\\nIn Paços de Brandão gelegen, nutzt das Museum zwei ehemalige Fabriken, die Fábrica Custódio Pais und die Fábrica dos Azevedos. Es ist ein lebendiges, erlebnisorientiertes Museum, das die Fabrikatmosphäre und das Know-how der Papierherstellung bewahrt hat. Die Dauerausstellung „Vom Mühlwerk zur Fabrik“ erstreckt sich über verschiedene Bereiche, entsprechend den manuellen und industriellen Herstellungsprozessen, und erzählt die Geschichte der Papierproduktion in dieser Region.\\nNoch heute ist sie eine der repräsentativsten und wichtigsten Wirtschaftstätigkeiten des Landkreises. Begleiten Sie uns und entdecken Sie die Geschichte der Papierindustrie im alten Terra de Santa Maria. Wir wünschen Ihnen einen wunderbaren Besuch.\",\n\"Im Volksmund als Fábrica de Cima (obere Fabrik) bekannt, beherbergte dieses Gebäude die ehemalige Fabrik der Azevedos, eine der bedeutendsten Papierfabriken im Landkreis Santa Maria da Feira. Francisco José de Azevedo Aguiar Brandão war ein innovativer und visionärer Mann. Er gründete 1825 diese „Schreibpapierfabrik“, wie sie in den Dokumenten der damaligen Zeit genannt wird.\\nNeben der Herstellung von Verpackungspapier lag der Schwerpunkt dieser Fabrik auf der Produktion von Schreib-, Kanzlei- und Vellumpapier. Die hervorragende Qualität ihres Schreibpapiers wurde 1863 mit einer von König D. Luís I. verliehenen Bronzemedaille ausgezeichnet.\\nAus dieser ehemaligen Fabrik, die bis 1966 in Betrieb war, konnten ein Dieselmotor sowie ein Teil der Maschine zur Papierzerkleinerung erhalten werden, die wir hier betrachten können.\\nDie riesige Felsformation in diesem Raum ist darauf zurückzuführen, dass wir uns in einem ehemaligen Granitsteinbruch befinden, der früher abgebaut wurde. Bei Hochwasser tritt der Fluss Rio Maior über seine Ufer und bedeckt die gesamte Felsmasse, auf der das Gebäude steht.\\nFolgen Sie dem Gang, gehen Sie hinaus in den Garten und hinunter zu den Ruinen.\",\n\"In den 1840er-Jahren errichtete Francisco José de Azevedo eine zweite, an die erste angrenzende Papierfabrik, die als Fábrica de Baixo (untere Fabrik) bekannt wurde.\\nDiese zweite Papierfabrik war bis zum 24. Oktober 1954 in Betrieb – ein Sonntag, der traurige Geschichte schrieb als der „Tag der Wasserhose“. Heftige Regenfälle ließen die Wasser des Rio Maior plötzlich ansteigen, was zur teilweisen und in manchen Fällen vollständigen Zerstörung von Wohnhäusern und Papierfabriken führte.\\nDie Gebäude der Fábrica de Cima wurden im darauffolgenden Jahr vollständig wiederhergestellt, doch die Fábrica de Baixo blieb für immer eine Ruine.\",\n\"Der Rio Maior entspringt in der Gemeinde Lourosa, Landkreis Santa Maria da Feira, und mündet in die Lagune von Paramos (Barrinha de Esmoriz), eine Küstenlagune zwischen den Landkreisen Espinho und Ovar. Entlang seines Laufs nimmt er die Namen der Orte oder Gemeinden an, die er durchquert, wie Rio de Lamas, Rio Maior, Rio de Paramos, unter anderen Bezeichnungen.\\nDieser Fluss ist nicht schiffbar und führt keine reichliche Wassermenge, doch beim Eintritt in die Gemeinde Paços de Brandão, am Ort Rio Maior, gewinnt er eine andere Dimension und bildet natürliche und künstliche Wehre. Die starken Geländeunterschiede und die Wehre, auch „presas“ genannt, ermöglichten es, das Wasser durch Mühlgräben zu leiten und so die von Wasserrädern gewonnene Energie zu nutzen.\\nDer Rio Maior könnte durchaus „Papierfluss“ genannt werden, denn vom Ort Rio Maior bis zur Lagune von Paramos versorgte er einst vierzehn Papierfabriken.\\nSetzen Sie den Rundgang bis zum nächsten Gebäude fort.\",\n\"Die Geschichte der Fabrik Custódio Pais reicht zurück bis zum 26. Oktober 1822, als Lourença Pinto und Joaquim de Carvalho ihren Gesellschaftsvertrag unterzeichneten. Es war die 6. Papierfabrik des Landkreises, aber die einzige mit einer Frau als Gründungsgesellschafterin.\\nErbaut aus zwei alten Getreidemühlen, begann der Engenho da Lourença als kleine, einfache Mühle, die Papier Blatt für Blatt herstellte. Ihre Produktion beruhte auf knapper, familiärer Arbeitskraft, und ihr Betrieb hing vom Wasserreichtum des Rio Maior ab.\\n1827 gründete Joaquim de Carvalho eine neue Papiermühle neben der ersten, die zu dieser Zeit bereits als Engenho da Lourença bekannt war.\\nDiese beiden Papiermühlen wurden 1916 von José Ferreira Pais erworben, der sie zu einer einzigen Papierfabrik zusammenführte und Jahre später mit der kontinuierlichen Papierherstellung begann.\\nIn den 1940er-Jahren errichtete die Familie Ferreira Pais ihr Wohnhaus im Fabrikgebäude selbst.\\nDieses Unternehmen blieb, stets im Besitz derselben Familie, bis 1989 in Betrieb.\",\n\"Lourença Pinto war die erste Papierunternehmerin in den Terras de Santa Maria. Obwohl sie Analphabetin war, führte sie ihr Unternehmergeist 1822 dazu, sich mit dem Papiermeister Joaquim Carvalho zusammenzuschließen. Gemeinsam bauten sie eine kleine Mühle für die handwerkliche Herstellung von Papier Blatt für Blatt, indem sie Getreidemühlen anpassten, die Lourença Pinto von ihrer Mutter geerbt hatte.\\nFrüher bestand der für die Papierherstellung verwendete Rohstoff aus Hanf-, Leinen- und Baumwolllumpen, die von Lumpensammlern an die Papierfabriken verkauft wurden. Diese Lumpen wurden, nachdem sie im Sieb sortiert und auf dem Schneidetisch zugeschnitten worden waren, in einer Maschine namens Holländer verfeinert, bis ein gleichmäßiger, sehr feiner Faserbrei entstand.\\nAnschließend wurde dieser Brei in den Produktionsbottich gegeben, in eine wässrige Lösung aus 20 % Faserbrei und 80 % Wasser. Mit Hilfe einer Form (ein Holzrahmen mit Boden aus Metallgewebe) sammelte ein Arbeiter, der „Laurente“ genannt wurde, die schwebenden Fasern und formte so den Papierbogen. Der frisch geformte Bogen wurde auf ein Wolltuch, den „Filz“, gestürzt. Auf jeden Bogen wurde ein neuer Filz gelegt, und der Vorgang wiederholte sich, bis ein Stapel entstand, der anschließend gepresst wurde, um überschüssiges Wasser zu entfernen. Die Bögen wurden dann im Espande (Trockenboden) zum Trocknen aufgehängt.\",\n\"Hier befinden sich die Maschinen, die den Rohstoff in Papierbrei verwandeln.\\nEnde des 19. Jahrhunderts, mit der steigenden Nachfrage nach Papier und dem Entstehen weiterer Fabriken, wurden Lumpen knapp, und es mussten neue Rohstoffe gefunden werden. Es wurden verschiedene Versuche mit Stroh unterschiedlicher Getreidesorten und sogar mit Reisschalen unternommen, bis man entdeckte, dass Holzstoff, reich an Zellulose, das Gewebe mit ausgezeichneten Ergebnissen ersetzen konnte.\\nObwohl Holzstoff bereits seit Mitte des 19. Jahrhunderts für die Papierherstellung verwendet wurde, verwendeten die Fabriken unserer Region weiterhin Baumwoll- und Leinenlumpen, denen sie gebrauchtes Papier beimischten.\\nInfolge der Verwendung von Altpapier als Rohstoff entstand eine neue Maschine, die „Lumpenmühle“ (moinho de galgas), die das Zerkleinern des Papiers erleichterte.\\nIn der Lumpenmühle beginnt die Herstellung des Faserbreis, indem Wasser zum Altpapier gegeben wird, das von zwei Mahlsteinen zerkleinert wird. Nach 1 Stunde gelangt dieser zerkleinerte Brei über einen Holzkanal zum Holländer, wo er für den gleichen Zeitraum verfeinert wird.\\nNach der Verfeinerung wird der entstandene Brei über einen unteren Kanal zum Becken des „Maxão“-Rads geleitet, das sich im Freien, rechts, befindet.\",\n\"Wasser war seit jeher ein grundlegendes Element für die Papierherstellung, sowohl während des Herstellungsprozesses als auch als Antriebskraft zur Erzeugung von Wasserkraft. Diese Energie wurde in den Papierfabriken von Santa Maria da Feira seit Beginn des 18. Jahrhunderts genutzt. Ab dem frühen 20. Jahrhundert wurde die Wasserkraft nach und nach durch Diesel- und Elektromotoren ersetzt, blieb jedoch weiterhin im Einsatz, sofern der Fluss ausreichend Wasser führte, um das Wasserrad anzutreiben.\\nIn der Fabrik Custódio Pais kam die elektrische Energie um 1952 hinzu und versorgte fortan einen Teil des Herstellungsprozesses. Beobachten Sie draußen, auf der linken Seite, das große Rad, das noch heute durch die Kraft des Rio Maior angetrieben wird. Auf der gegenüberliegenden Seite befindet sich das Becken des Maxão-Rads, das den im Holländer verfeinerten Papierbrei aufnimmt.\\nDie eigentümliche, alte grüne Schalttafel steuert die Lumpenmühle und den Holländer. Letzterer kann ebenfalls mit Wasserkraft betrieben werden.\",\n\"Ab 1920 wurde hier dank der Anschaffung einer Rundsiebmaschine industriell recyceltes Papier hergestellt. Vom Maxão-Rad aus wird der Faserbrei gesammelt und über eine Rinne zum Siebbecken geleitet, wo Verunreinigungen herausgefiltert werden. Die eintretende Breimenge wird vom Maschinisten gesteuert, wodurch das Flächengewicht des Papiers bestimmt wird. Nach dem Filtern gelangt der Brei zu einem zweiten Becken, der sogenannten Bütte. In der Bütte sammelt eine sich ständig drehende Rundform die schwebenden Fasern und bildet so den Papierbogen. Der Papierbogen wird gegen den Wollfilz gepresst und zu den Kalanderwalzen transportiert, wo er gepresst wird, um überschüssiges Wasser abzugeben, und sich dabei vom Filz löst. Anschließend leitet der Maschinist das Papier zur Haspel, einer Art Spule, wo es aufgewickelt wird. Da es zwei Haspeln gibt, wird die volle Haspel durch die leere ersetzt.\\nDas noch feuchte Papier wird auf den Schneidetisch gelegt, wo es von Hand mit einem Messer geschnitten wird. Es wird zweimal gefaltet, um die Papierstapel („postas“) zu bilden. Diese verbleiben neben dem Tisch, bis sie zur Casa do Espande transportiert werden, wo sie zum Trocknen aufgehängt werden.\\nGehen Sie bis zum Ende des Flurs, biegen Sie links ab und gehen Sie hinauf in das oberste Stockwerk.\",\n\"Die Casa do Espande ist der für das Trocknen des Papiers vorgesehene Raum. Meist in den oberen Stockwerken gelegen, ist er einer der charakteristischsten Räume dieser alten Fabriken.\\nWie man hinter den heutigen Schutzscheiben erkennen kann, bestanden die Wände aus verstellbaren Holzjalousien, die die Luftzirkulation ermöglichten, um das Trocknen des Papiers zu beschleunigen, oder den Raum vor direktem Regen schützten.\\nDie „Botadeiras“ waren die Arbeiterinnen, die die noch feuchten „grünen“ Papierstapel auf dem Kopf von der Casa da Máquina zum Espande trugen.\\nJeder Stapel wog im Durchschnitt 45 Kilogramm, was keine leichte Aufgabe war. Im Espande angekommen, hängten die Arbeiterinnen mit Hilfe einer Holzgabel die zur Hälfte gefalteten Papierbögen zum Trocknen an den „Tesas“ auf – einer Art Trockengestell mit an Holzstützen befestigten Drähten. Trotz der Härte dieser Arbeit waren die Trockenräume angesichts der Bedingungen und des erforderlichen Aufwands fröhliche Orte, erfüllt vom Gesang der Botadeiras, der der Arbeit des Aufhängens des Papiers auf den Tesas einen gleichmäßigen Rhythmus verlieh.\\nNach dem Trocknen wurde das Papier gesammelt und einer ersten Auswahl unterzogen, wobei zerrissene oder fehlerhafte Bögen aussortiert wurden. Diese wurden erneut recycelt. Nach dieser Auswahl wurde das Papier zur Casa do Lixador gebracht.\",\n\"Die Casa do Lixador ist ein weitläufiger Raum auf Straßenniveau. Es ist der am wenigsten kalte und feuchte Ort im gesamten Fabrikgelände. Nach dem Trocknen in der Casa do Espande wurde das Papier hierher gebracht, für die letzte Phase des Herstellungsprozesses – Veredelung und Verpackung.\\nHier wählten die Arbeiterinnen das kleinformatige Papier aus, „schliffen“ es, das heißt glätteten es, und zählten die Bögen.\\nNach dem Zählen wurde das Papier zur Hälfte gefaltet, wodurch ein Heft aus 25 Bögen entstand, das als „mão“ (Hand) Papier bezeichnet wurde. Ein Satz von 20 „mãos“ ergab ein Ries.\\nGroßformatiges Papier durchlief diesen Glättungs- und Zählprozess nicht, sondern wurde lediglich auf der Dezimalwaage gewogen und direkt in die Presse gelegt. In der Presse wurde das Papier seitlich mit einem Schlegel geschlagen, um die Bögen auszurichten, die dann mit Seil oder Draht zu einem Ballen gebunden wurden. Die Ballen wogen anfangs 100 kg, später wurden sie auf 50 kg reduziert, heute wiegen sie nur noch 25 kg.\\nSobald sie fertig waren, wurden die Ballen und Papierriese nach draußen verladen (durch die zur Straße führende Tür), mit Ochsenkarren und später mit Lastwagen zum örtlichen Markt oder zu den Großhändlern in der Stadt Porto transportiert.\",\n\"Ab Beginn des 20. Jahrhunderts entstanden im Landkreis Santa Maria da Feira und in benachbarten Landkreisen wie Ovar Dutzende „Sacarias“, die der Herstellung von Papiertüten gewidmet waren.\\nDie Sacarias waren kleine Betriebe, in denen hauptsächlich Frauen – die „Saqueiras“ – arbeiteten und Papiertüten, sogenannte „Cartuchos“, herstellten. Nach dem Zuschneiden wurde das Papier diagonal auf dem Tisch der Sacaria mit Hilfe eines Richtscheits ausgebreitet. Anschließend wurde mit einer Bürste ein aus Stärkemehl und Wasser hergestellter Kleister auf das Papier aufgetragen. Die Tüten wurden dann mit Hilfe von auf der Tischplatte befestigten Tütenformen unterschiedlicher Größe geformt. Nach der Herstellung wurden die Tüten in Trockner gelegt, um den Kleister zu trocknen.\\nIn manchen Sacarias gab es Maschinen zur Personalisierung der Tüten. Am häufigsten war die „Riscadeira“, die magenta- oder blaufarbene Linien druckte. Es konnte auch kleine Buchdruckmaschinen geben, wie diese vom Typ Minerva, die Text mit Informationen über das Produkt oder das Geschäft druckte.\\nAb den 1960er-Jahren, mit dem Aufstieg der Kunststoffindustrie, wurden die alten Papiertüten allmählich ersetzt, was zum fortschreitenden Niedergang der Sacarias führte. Dennoch sind einige Unternehmen, die auf ständige Produktverbesserung und technologische Innovation setzen, auch heute noch voll in Betrieb und produzieren Verpackungen für verschiedene Zwecke.\\nVerlassen Sie nun den Raum und gehen Sie die Treppe hinunter.\",\n\"In diesem Ausstellungsbereich lernen wir den modernen Papierherstellungsprozess kennen, der Eukalyptus- und Kiefernholz als Rohstoff verwendet.\\nDiese Ausstellung präsentiert aufeinanderfolgende Teilbereiche, die den Umwandlungsprozess erkunden, der beim Baum, noch in seinem natürlichen Lebensraum, beginnt und bei der Vielfalt und Nachhaltigkeit portugiesischer Papierprodukte endet.\\nEntlang dieses Rundgangs werden Themen wie die nachhaltige Waldbewirtschaftung und der Schutz der biologischen Vielfalt, die Verbreitung von Waldarten im portugiesischen Festland, die für die Papierproduktion verwendeten Fasertypen, die verschiedenen Phasen der Rohstoffumwandlung, der Herstellungsprozess sowie verschiedene Papiersorten und ihre Eigenschaften behandelt.\\nAm Ende dieses Bereichs können Sie über den Multimedia-Kiosk auf ergänzende Informationen zugreifen, insbesondere zur Identifizierung von Fabriken, die sich der Zellstoff- und Papierproduktion in Portugal widmen, zu Kuriositäten über den Eukalyptus globulus, zur Papierproduktion sowie zur Vielseitigkeit und Anwendbarkeit von Papier und Karton, aus denen neue Alltagsmaterialien und -objekte entstehen.\",\n\"Vollpappe, auch „Papelão“ genannt, ist eine dickere Pappe, die für Verpackungen und Kartons verwendet wird. Ihr Herstellungsprozess ähnelt stark dem von Papier. Der Hauptunterschied zeigt sich am Ende der Produktionsmaschine: Im Gegensatz zu Papier wird die Pappe nicht auf eine Haspel gewickelt, sondern in Platten geschnitten, die bis zum Trocknen übereinandergestapelt werden. Früher war die Pappenproduktion saisonabhängig, da sie an der frischen Luft trocknete und somit von günstigen Wetterbedingungen abhing. Im Laufe der Jahre bauten einige Unternehmen eine Art Gewächshaus mit Förderbändern, um diesen Trocknungsprozess zu beschleunigen. Nach dem Trocknen wurde die Pappe gesammelt, sortiert, auf der Glättmaschine geglättet und nach Dicke gruppiert. Sie wurde in Bündeln von 25 kg gebunden. An der Seite des Bündels wurde die Gesamtzahl der Pappbögen vermerkt. Bündel mit mehr Bögen entsprachen dünnerer Pappe.\",\n\"„Vom Filigran zum Wasserzeichen“ ist der Name des Ausstellungsbereichs, der in diesem Raum entstehen wird, mit der Präsentation einer Sammlung von Papieren mit nationalen, für dieses Gebiet besonders repräsentativen Wasserzeichen.\\nFiligran ist eine ornamentale Arbeit, bei der sehr feine Metalldrähte verwendet werden, um Figuren, Buchstaben und Zahlen zu formen. Diese Figuren werden wiederum auf der Oberfläche des Metallgewebes, aus dem die Papierform besteht, aufgestickt oder aufgebracht. Das im Gegenlicht sichtbare Wasserzeichen des Papiers ist das Ergebnis des Filigrans, da sich über den Metalldrähten weniger Fasern ansammeln, wodurch Bereiche größerer Transparenz entstehen.\\nHier heben wir eine Filigranwalze der ehemaligen Papierfabrik von Matrena, in Tomar, hervor, die ein allegorisches Filigran der Portugiesischen Republik trägt. Wir werden Ihnen hier bald weitere Neuigkeiten präsentieren.\\nFür den Moment neigt sich unser Besuch dem Ende zu.\\nWir hoffen, dass Ihnen diese Reise durch die Welt des Papiers in den Terras de Santa Maria gefallen hat.\\nFalls Sie einen Audioguide des Museums nutzen, bitten wir Sie, diesen an der Rezeption zurückzugeben. Sie können auch unseren Laden besuchen und ein Andenken an diesen Tag mitnehmen.\\nFalls Sie es noch nicht kennen, empfehlen wir einen Besuch des Museu Convento dos Lóios in der Stadt Santa Maria da Feira. Vielen Dank und bis zum nächsten Besuch!\",\n];\n\nconst FR_BODIES = [\n\"Le Museu do Papel Terras de Santa Maria vous souhaite la bienvenue !\\nNous sommes un musée industriel consacré à l'histoire du papier, et notre principale mission est de préserver la mémoire du quotidien des papetiers, dans une région qui compte plus de 300 ans d'histoire liée à l'industrie du papier.\\nEn effet, la première fabrique de papier de la commune fut fondée en 1708 dans la paroisse de São Paio de Oleiros. À partir de là, l'art de fabriquer le papier s'est répandu dans toute la commune et dans les communes voisines. La création d'un musée consacré à l'histoire du papier se justifie donc pleinement.\\nSitué à Paços de Brandão, le musée occupe deux anciennes fabriques, la Fábrica Custódio Pais et la Fábrica dos Azevedos. C'est un musée vivant et expérientiel qui a préservé l'atmosphère de l'usine et le savoir-faire de l'art de fabriquer le papier. L'exposition permanente « Du Moulin à la Fabrique » se déploie dans différents espaces, suivant les procédés de fabrication manuelle et industrielle, racontant l'histoire de la production de papier dans cette région.\\nAujourd'hui encore, il s'agit de l'une des activités économiques les plus représentatives et importantes de la commune. Venez découvrir avec nous l'histoire de l'industrie papetière dans l'ancienne Terra de Santa Maria. Nous vous souhaitons une excellente visite.\",\n\"Communément appelée Fábrica de Cima (fabrique du haut), ce bâtiment abritait l'ancienne fabrique des Azevedos, l'une des unités papetières les plus importantes de la commune de Santa Maria da Feira. Francisco José de Azevedo Aguiar Brandão était un homme innovant et visionnaire. Il fonda en 1825 cette « Fabrique de Papier à Écrire », comme elle est mentionnée dans les documents de l'époque.\\nOutre la fabrication de papier d'emballage, cette unité misait principalement sur la production de papier à écrire, de papier ministre et de vélin. L'excellente qualité de son papier à écrire fut récompensée en 1863 par une médaille de bronze décernée par le roi D. Luís Ier.\\nDe cette ancienne fabrique, restée en activité jusqu'en 1966, il a été possible de conserver un moteur diesel et une partie de la machine utilisée pour broyer le papier, que nous pouvons observer ici.\\nL'immense formation rocheuse de cette salle s'explique par le fait que nous nous trouvons dans une ancienne carrière de granit exploitée par le passé. Lors des crues, le Rio Maior déborde de son lit, recouvrant toute la masse rocheuse sur laquelle repose le bâtiment.\\nSuivez le couloir, sortez vers le jardin et descendez jusqu'aux ruines.\",\n\"Dans les années 1840, Francisco José de Azevedo fit construire une seconde fabrique de papier, attenante à la première, connue sous le nom de Fábrica de Baixo (fabrique du bas).\\nCette seconde unité papetière fonctionna jusqu'au 24 octobre 1954, un dimanche resté tristement gravé dans l'histoire comme le « jour de la trombe d'eau ». De fortes pluies provoquèrent une montée soudaine des eaux du Rio Maior, entraînant la destruction partielle, et dans certains cas totale, d'habitations et de fabriques de papier.\\nLes bâtiments de la Fábrica de Cima furent entièrement restaurés l'année suivante, mais la Fábrica de Baixo demeura à jamais en ruines.\",\n\"Le Rio Maior prend sa source dans la paroisse de Lourosa, commune de Santa Maria da Feira, et se jette dans la lagune de Paramos (Barrinha de Esmoriz), une lagune côtière située entre les communes d'Espinho et d'Ovar. Tout au long de son parcours, il prend le nom des lieux ou paroisses qu'il traverse, tels que Rio de Lamas, Rio Maior, Rio de Paramos, entre autres appellations.\\nCette rivière n'est pas navigable et son débit n'est pas abondant, mais en entrant dans la paroisse de Paços de Brandão, au lieu-dit Rio Maior, elle prend une autre dimension, formant des barrages naturels et artificiels. Les dénivelés marqués du terrain et les barrages, aussi appelés « presas », permettaient de conduire l'eau par des biefs, rendant possible l'exploitation énergétique grâce à l'action des roues hydrauliques.\\nLe Rio Maior pourrait bien s'appeler la « rivière du papier », car du lieu-dit Rio Maior jusqu'à la lagune de Paramos, il alimentait autrefois quatorze fabriques de papier.\\nPoursuivez le parcours jusqu'au bâtiment suivant.\",\n\"L'histoire de la fabrique Custódio Pais remonte au 26 octobre 1822, lorsque Lourença Pinto et Joaquim de Carvalho signèrent leur acte de société. Ce fut la 6ᵉ unité papetière de la commune, mais la seule à avoir eu une femme comme associée fondatrice.\\nConstruit à partir de deux anciens moulins à farine, l'Engenho da Lourença débuta comme un petit moulin rudimentaire fabriquant du papier feuille à feuille. Sa production reposait sur une main-d'œuvre familiale rare, et son fonctionnement dépendait de l'abondance des eaux du Rio Maior.\\nEn 1827, Joaquim de Carvalho fonda un nouveau moulin à papier, à côté du premier engenho, déjà connu à l'époque sous le nom d'Engenho da Lourença.\\nCes deux moulins à papier furent acquis en 1916 par José Ferreira Pais, qui les transforma en une seule unité papetière, initiant plus tard la production de papier en continu.\\nDans les années 1940, la famille Ferreira Pais fit construire sa résidence dans le bâtiment même de la fabrique.\\nCette entreprise resta en activité, toujours au sein de la même famille, jusqu'en 1989.\",\n\"Lourença Pinto fut la première femme entrepreneuse du papier dans les Terras de Santa Maria. Bien qu'analphabète, son esprit d'entreprise la conduisit à s'associer en 1822 avec le maître papetier Joaquim Carvalho. Ensemble, ils construisirent un petit moulin pour la production artisanale de papier feuille à feuille, en adaptant des moulins à céréales que Lourença Pinto avait hérités de sa mère.\\nAutrefois, la matière première utilisée pour la fabrication du papier était constituée de chiffons de chanvre, de lin et de coton, vendus aux fabriques de papier par les chiffonniers. Ces chiffons, triés au crible puis coupés sur la table à découper, étaient affinés dans une machine appelée pile hollandaise, jusqu'à obtenir une pâte homogène et très fine.\\nCette pâte était ensuite placée dans la cuve de production, dans une solution aqueuse composée à 20 % de pâte et à 80 % d'eau. À l'aide d'une forme (plateau de bois à fond en toile métallique), un ouvrier, appelé « laurente », recueillait les fibres en suspension, formant ainsi la feuille de papier. La feuille tout juste formée était démoulée sur un tissu de laine, la « baeta » ou feutre. Sur chaque feuille était posé un nouveau feutre, et le processus se répétait jusqu'à obtenir une pile, ensuite pressée pour éliminer l'excès d'eau. Les feuilles étaient alors mises à sécher dans l'Espande.\",\n\"C'est ici que fonctionnent les machines qui transforment la matière première en pâte à papier.\\nÀ la fin du 19ᵉ siècle, avec l'augmentation de la demande de papier et l'apparition de nouvelles fabriques, le chiffon devint rare, et il fallut trouver de nouvelles matières premières. Plusieurs essais furent réalisés avec de la paille de différentes céréales, et même avec de la balle de riz, jusqu'à ce que l'on découvre que la pâte de bois, riche en cellulose, pouvait remplacer le tissu avec d'excellents résultats.\\nBien que la pâte de bois soit utilisée pour la production de papier depuis le milieu du 19ᵉ siècle, les fabriques de notre région continuèrent d'utiliser des chiffons de coton et de lin, auxquels elles ajoutaient du papier usagé.\\nEn conséquence de l'utilisation de vieux papier comme matière première, apparut une nouvelle machine, le moulin à galgas, qui facilita le broyage du papier.\\nC'est dans le moulin à galgas que débute la production de pâte, en ajoutant de l'eau au papier usagé, broyé par deux meules. Au bout d'une heure, cette pâte broyée passe par un canal en bois jusqu'à la pile hollandaise, où elle est affinée pendant une période équivalente.\\nUne fois affinée, la pâte obtenue est conduite par un canal inférieur jusqu'au bassin de la roue du « maxão », situé à l'extérieur, sur la droite.\",\n\"L'eau a toujours été un élément fondamental pour la production de papier, tant durant le processus de fabrication que comme force motrice pour la production d'énergie hydraulique. Cette énergie fut utilisée dans les fabriques de papier de Santa Maria da Feira dès le début du 18ᵉ siècle. À partir du début du 20ᵉ siècle, l'énergie hydraulique fut progressivement remplacée par des moteurs diesel et électriques, tout en restant utilisée dès que le débit de la rivière était suffisant pour actionner la roue hydraulique.\\nÀ la fabrique Custódio Pais, l'électricité arriva vers 1952, alimentant une partie du processus de fabrication. Observez à l'extérieur, sur la gauche, la grande roue encore actionnée aujourd'hui par la force des eaux du Rio Maior. Du côté opposé se trouve le bassin de la roue du maxão, qui reçoit la pâte à papier affinée dans la pile hollandaise.\\nLe curieux et ancien tableau électrique de couleur verte commande le moulin à galgas et la pile hollandaise. Cette dernière peut également être actionnée par l'énergie hydraulique.\",\n\"À partir de 1920, on commença à y produire du papier recyclé de façon industrielle, grâce à l'acquisition d'une machine à forme ronde. Depuis la roue du maxão, la pâte est recueillie et conduite par un canal jusqu'au bassin à plateaux, où les impuretés sont filtrées. La quantité de pâte entrante est contrôlée par le machiniste, déterminant ainsi le grammage du papier. Une fois filtrée, la pâte est conduite vers un second bassin appelé cuve. Dans la cuve, une forme ronde en rotation constante recueille les fibres en suspension, formant la feuille de papier. La feuille de papier est pressée contre le feutre de laine, puis transportée jusqu'aux rouleaux de la calandre, où elle est pressée pour libérer l'excès d'eau, se séparant du feutre. Le machiniste guide ensuite le papier vers l'enrouleur, une sorte de bobine, où il est enroulé. Comme il existe deux enrouleurs, lorsque l'un est chargé de papier, il est remplacé par celui qui est vide.\\nLe papier encore humide est déposé sur la table de coupe, où il est découpé à la main au couteau. Il est plié deux fois pour former les « postas » de papier. Celles-ci restent près de la table jusqu'à leur transport vers la Casa do Espande, où elles sont mises à sécher.\\nPoursuivez jusqu'au bout du couloir, tournez à gauche et montez jusqu'au dernier étage.\",\n\"La Casa do Espande est l'espace destiné au séchage du papier. Situé de préférence aux étages supérieurs, c'est l'un des espaces les plus caractéristiques de ces anciennes fabriques.\\nComme on peut le voir derrière les vitres de protection actuelles, les murs étaient constitués de persiennes en bois réglables, permettant à l'air de circuler pour accélérer le séchage du papier, ou protégeant l'espace de la pluie directe.\\nLes « Botadeiras » étaient les ouvrières qui transportaient sur la tête les piles de papier « vert », encore humide, depuis la Casa da Máquina jusqu'à l'Espande.\\nChaque charge pesait en moyenne 45 kilos, ce qui n'était pas une tâche facile. Une fois dans l'Espande, à l'aide d'une fourche en bois, les ouvrières « suspendaient » à sécher les feuilles de papier pliées en deux, sur les « tesas », une sorte d'étendoirs avec des fils métalliques fixés sur des supports en bois. Malgré la dureté de ce travail, compte tenu des conditions et de l'effort requis, les séchoirs étaient des lieux animés, remplis des chants des botadeiras, qui rythmaient le travail de suspension du papier sur les tesas.\\nAprès le séchage, le papier était collecté et soumis à une première sélection, retirant les feuilles déchirées ou défectueuses. Celles-ci étaient à nouveau recyclées. Après cette sélection, le papier était emporté vers la Casa do Lixador.\",\n\"La Casa do Lixador est un espace vaste, situé au niveau de la route. C'est l'endroit le moins froid et le moins humide de tout le site industriel. Après séchage dans la Casa do Espande, le papier y était transporté pour la dernière étape du processus de fabrication : la finition et l'emballage.\\nIci, les ouvrières sélectionnaient le papier de petit format, le « ponçaient », c'est-à-dire le lissaient, et comptaient les feuilles.\\nUne fois comptées, les feuilles étaient pliées en deux, formant un cahier de 25 feuilles, appelé une « main » de papier. Un ensemble de 20 « mains » formait une rame.\\nLe papier de grand format ne passait pas par ce processus de lissage et de comptage : il était simplement pesé sur la balance décimale et placé directement dans la presse. Une fois dans la presse, le papier était frappé latéralement avec un maillet pour aligner les feuilles, qui étaient ensuite attachées avec une corde ou un fil de fer, formant un ballot. Les ballots pesaient initialement 100 kg, réduits par la suite à 50 kg, et ne pèsent aujourd'hui plus que 25 kg.\\nUne fois prêts, les ballots et les rames de papier étaient chargés vers l'extérieur (par la porte donnant sur la route), transportés par des chariots à bœufs, puis plus tard par des camions, vers le marché local ou vers les grossistes de la ville de Porto.\",\n\"À partir du début du 20ᵉ siècle, dans la commune de Santa Maria da Feira et dans les communes voisines comme Ovar, des dizaines de « Sacarias » consacrées à la production de sacs en papier virent le jour.\\nLes Sacarias étaient de petites entreprises où travaillaient essentiellement des femmes — les « saqueiras » — qui produisaient des sacs en papier appelés « cartuchos ». Après découpe, le papier était étalé en diagonale sur la table de l'atelier, à l'aide d'une règle. Ensuite, une colle à base de farine d'amidon et d'eau était appliquée sur le papier au pinceau. Les sacs étaient alors formés à l'aide de gabarits de tailles diverses, fixés sur le plateau de la table. Une fois fabriqués, les sacs étaient placés dans des séchoirs pour sécher la colle.\\nCertains ateliers pouvaient disposer de machines pour personnaliser les sacs. La plus courante était la « riscadeira », qui imprimait des lignes de couleur magenta ou bleue. On pouvait aussi y trouver de petites machines typographiques, comme celle-ci de type Minerva, qui imprimait un texte donnant des informations sur le produit ou l'établissement commercial.\\nÀ partir des années 1960, avec l'essor de l'industrie du plastique, les vieux sacs en papier furent progressivement remplacés, provoquant le déclin progressif des sacarias. Cependant, certaines entreprises, misant sur l'amélioration constante du produit et l'innovation technologique, restent aujourd'hui pleinement en activité, produisant des emballages à diverses fins.\\nSortez maintenant de la salle et descendez les escaliers.\",\n\"Dans cet espace d'exposition, nous découvrirons le procédé moderne de fabrication du papier, qui utilise comme matière première le bois d'eucalyptus et de pin.\\nCette exposition présente des sous-sections séquentielles qui explorent le processus de transformation, débutant par l'arbre, encore dans son habitat naturel, et se terminant par la diversité et la durabilité des produits papetiers portugais.\\nTout au long de ce parcours sont abordés des thèmes tels que la gestion durable de la forêt et la protection de la biodiversité, la répartition des essences forestières au Portugal continental, les types de fibres utilisés dans la production de papier, les différentes étapes de transformation de la matière première, le procédé de fabrication, ainsi que les différents types de papier et leurs caractéristiques.\\nÀ la fin de cet espace, en accédant à la borne multimédia, vous pourrez consulter des informations complémentaires, notamment l'identification des usines dédiées à la production de pâte et de papier au Portugal, des curiosités sur l'eucalyptus globulus, sur la production de papier, ainsi que sur la polyvalence et l'applicabilité du papier et du carton, à l'origine de nouveaux supports et objets du quotidien.\",\n\"Le carton compact, également appelé « papelão », est un carton plus épais utilisé pour les emballages et les boîtes. Son procédé de fabrication est très semblable à celui du papier. La principale différence intervient en fin de machine de production, moment où le carton, contrairement au papier, n'est pas enroulé sur une bobine, mais découpé en plaques, empilées les unes sur les autres, jusqu'au moment du séchage. Autrefois, la production de carton était saisonnière, car il séchait à l'air libre, dépendant donc de conditions climatiques favorables. Au fil des années, certaines entreprises construisirent une sorte de serre, équipée de tapis roulants, pour accélérer ce processus de séchage. Une fois sec, le carton était collecté, trié, lissé sur la lamineuse et regroupé selon son épaisseur. Il était attaché en ballots de 25 kg. Sur le côté du ballot était indiqué le nombre total de feuilles de carton. Les ballots comportant davantage de feuilles correspondaient à un carton plus fin.\",\n\"« De la Filigrane à la Marque d'Eau » est le nom de l'espace d'exposition qui naîtra dans cet espace, présentant une collection de papiers portant des filigranes nationaux, parmi les plus représentatifs de ce territoire.\\nLa filigrane est un travail ornemental utilisant des fils métalliques très fins pour former des figures, des lettres et des chiffres. Ces figures sont à leur tour brodées ou appliquées sur la surface de la toile métallique qui compose la forme de fabrication du papier. Le filigrane du papier, visible en transparence, résulte de ce travail, car sur les fils métalliques s'accumulent moins de fibres, créant des zones de plus grande transparence.\\nNous mettons ici en avant un rouleau à filigraner de l'ancienne fabrique de papier de Matrena, à Tomar, arborant un filigrane allégorique à la République portugaise. D'autres nouveautés vous seront bientôt présentées ici.\\nPour l'heure, notre visite touche à sa fin.\\nNous espérons que ce voyage à travers le monde du papier dans les Terras de Santa Maria vous aura plu.\\nSi vous utilisez un audioguide du musée, merci de bien vouloir le rendre à la réception. Vous pouvez également visiter notre boutique et emporter un souvenir de cette journée.\\nSi vous ne le connaissez pas encore, nous vous suggérons de visiter le Museu Convento dos Lóios, dans la ville de Santa Maria da Feira. Merci, et à bientôt pour une prochaine visite !\",\n];\n\nconst ES_BODIES = [\n\"¡El Museu do Papel Terras de Santa Maria le da la bienvenida!\\nSomos un museo industrial dedicado a la historia del papel, y nuestra principal misión es preservar la memoria cotidiana del oficio papelero, en una región con más de 300 años de historia ligada a la industria del papel.\\nDe hecho, la primera fábrica de papel del municipio se fundó en 1708 en la parroquia de São Paio de Oleiros. A partir de ahí, el arte de fabricar papel se difundió por todo el municipio y por los municipios vecinos. Se justifica así la creación de un museo dedicado a la historia del papel.\\nSituado en Paços de Brandão, el museo ocupa dos antiguas fábricas, la Fábrica Custódio Pais y la Fábrica dos Azevedos. Es un museo vivo y experiencial que ha conservado el ambiente fabril y el saber hacer del arte de fabricar papel. La exposición permanente \\\"Del Ingenio a la Fábrica\\\" se desarrolla en distintas áreas, según los procesos de fabricación manual e industrial, contando la historia de la producción de papel en esta región.\\nAún hoy es una de las actividades económicas más representativas e importantes del municipio. Acompáñenos a conocer la historia de la industria papelera en la antigua Terra de Santa Maria. Le deseamos una excelente visita.\",\n\"Conocida popularmente como Fábrica de Cima, en este edificio funcionó la antigua Fábrica dos Azevedos, una de las unidades papeleras más importantes del municipio de Santa Maria da Feira. Francisco José de Azevedo Aguiar Brandão fue un hombre innovador y visionario. Fundó en 1825 esta \\\"Fábrica de Papel de Escribir\\\", como se la denomina en la documentación de la época.\\nAdemás de fabricar papel de embalaje, la gran apuesta de esta unidad fue la manufactura de papel de escritura, de oficio y de vitela. La excelente calidad de su papel de escritura fue distinguida en 1863 con una medalla de cobre concedida por el rey D. Luís I.\\nDe esta antigua fábrica, que permaneció activa hasta 1966, fue posible conservar un motor diésel y parte de la máquina utilizada para triturar el papel, que podemos observar aquí.\\nLa enorme formación rocosa de esta sala se debe a que nos encontramos en una antigua cantera de granito explotada en el pasado. En días de crecida, el Rio Maior desborda sus orillas, cubriendo toda la masa rocosa sobre la que se asienta el edificio.\\nSiga por el pasillo, salga al jardín y baje hasta las ruinas.\",\n\"En la década de 1840, Francisco José de Azevedo construyó una segunda fábrica de papel, contigua a la primera, que pasó a conocerse como Fábrica de Baixo.\\nEsta segunda unidad papelera funcionó hasta el 24 de octubre de 1954, un domingo que quedó tristemente grabado en la historia como el \\\"día de la tromba de agua\\\". Fuertes lluvias provocaron una crecida repentina del Rio Maior, que destruyó parcial, y en algunos casos totalmente, viviendas y fábricas de papel.\\nLos edificios de la Fábrica de Cima fueron completamente restaurados al año siguiente de esta tromba de agua, pero la Fábrica de Baixo quedó en ruinas para siempre.\",\n\"El Rio Maior nace en la parroquia de Lourosa, municipio de Santa Maria da Feira, y desemboca en la Laguna de Paramos (Barrinha de Esmoriz), una laguna costera situada entre los municipios de Espinho y Ovar. A lo largo de su curso va tomando el nombre de los lugares o parroquias que atraviesa, como Rio de Lamas, Rio Maior y Rio de Paramos, entre otras denominaciones.\\nEste río no es navegable ni tiene un caudal abundante, pero al entrar en la parroquia de Paços de Brandão, en el lugar llamado Rio Maior, adquiere otra dimensión, formando azudes naturales y artificiales. Los desniveles pronunciados del terreno y los azudes, también llamados \\\"presas\\\", permitían conducir el agua a través de canales, posibilitando el aprovechamiento energético mediante ruedas hidráulicas.\\nAl Rio Maior bien podría llamársele el \\\"río del papel\\\", pues desde el lugar de Rio Maior hasta la Laguna de Paramos llegó a servir a catorce fábricas de papel.\\nContinúe el recorrido hasta el siguiente edificio.\",\n\"La historia de la Fábrica Custódio Pais se remonta al 26 de octubre de 1822, cuando Lourença Pinto y Joaquim de Carvalho firmaron su escritura de sociedad. Fue la 6ª unidad papelera del municipio, pero la única que tuvo a una mujer como socia fundadora.\\nConstruido a partir de dos antiguos molinos harineros, el Engenho da Lourença comenzó siendo un pequeño y rudimentario molino que fabricaba papel hoja a hoja. Su producción se basaba en mano de obra escasa y familiar, y su funcionamiento dependía de la abundancia de las aguas del Rio Maior.\\nEn 1827, Joaquim de Carvalho fundó un nuevo molino de papel junto al primer ingenio, que ya entonces era conocido como el Engenho da Lourença.\\nEstos dos ingenios de papel fueron adquiridos en 1916 por José Ferreira Pais, quien los transformó en una única unidad papelera, iniciando años más tarde la producción de papel en continuo.\\nEn la década de 1940, la familia Ferreira Pais construyó su vivienda en el propio edificio de la fábrica.\\nEsta empresa permaneció en activo, siempre en manos de la misma familia, hasta 1989.\",\n\"Lourença Pinto fue la primera mujer empresaria del papel en las Terras de Santa Maria. Aunque analfabeta, su espíritu emprendedor la llevó a asociarse en 1822 con el maestro papelero Joaquim Carvalho. Juntos construyeron un pequeño ingenio para la producción artesanal de papel hoja a hoja, adaptando unos molinos de cereal que Lourença Pinto había heredado de su madre.\\nEn el pasado, la materia prima utilizada en la fabricación de papel eran trapos de cáñamo, de lino y de algodón, vendidos a las fábricas de papel por los traperos. Estos trapos, tras ser seleccionados en la criba y cortados en la mesa de corte, se refinaban en una máquina llamada pila holandesa, hasta obtener una pasta homogénea y muy fina.\\nDespués, esa pasta se colocaba en la tina de producción, en una solución acuosa compuesta por un 20% de pasta y un 80% de agua. Con la ayuda de una forma (bandeja de madera con fondo de malla metálica), un operario, llamado \\\"laurente\\\", recogía las fibras en suspensión, formando así la hoja de papel. La hoja recién hecha se volcaba sobre un paño de lana, la baeta o fieltro. Sobre cada hoja se colocaba una nueva baeta, repitiendo el proceso hasta formar una pila que después se prensaba para eliminar el exceso de agua. Las hojas se ponían entonces a secar en el Espande.\",\n\"Aquí es donde funcionan las máquinas que transforman la materia prima en pasta de papel.\\nA finales del siglo XIX, con el aumento de la demanda de papel y la aparición de más fábricas, el trapo se volvió escaso, siendo necesario encontrar nuevas materias primas. Se hicieron varias pruebas con paja de diferentes cereales, e incluso con cáscara de arroz, hasta que se descubrió que la pasta de madera, rica en celulosa, podía sustituir al tejido con excelentes resultados.\\nAunque desde mediados del siglo XIX ya se utilizaba pasta de madera para la producción de papel, las fábricas de nuestra región siguieron usando trapos de algodón y de lino, a los que añadían papel usado.\\nComo consecuencia del uso de papel viejo como materia prima, surge una nueva máquina, el molino de galgas, que facilitó la trituración del papel.\\nEs en el molino de galgas donde se produce la pasta, añadiendo agua al papel usado, triturado por dos muelas. Al cabo de 1 hora, esa pasta triturada pasa por un canal de madera hasta la pila holandesa, donde se refina durante el mismo periodo.\\nUna vez refinada, la pasta resultante se conduce por un canal inferior hasta el tanque de la rueda del \\\"maxão\\\", situado en el exterior, a la derecha.\",\n\"El agua siempre ha sido un elemento fundamental para la producción de papel, tanto durante el proceso de fabricación como en su uso como fuerza motriz para la generación de energía hidráulica. Esta energía se utilizó en las fábricas de papel de Santa Maria da Feira desde principios del siglo XVIII. A partir de principios del siglo XX, la energía hidráulica fue sustituida gradualmente por motores diésel y eléctricos, aunque se mantuvo como recurso siempre que el caudal del río era suficiente para accionar la rueda hidráulica.\\nEn la Fábrica Custódio Pais, la energía eléctrica llegó hacia 1952, pasando a alimentar parte del proceso de fabricación. Observe en el exterior, a la izquierda, la gran rueda que todavía hoy es accionada por la fuerza de las aguas del Rio Maior. En el lado opuesto se encuentra el tanque de la rueda del maxão, que recibe la pasta de papel refinada en la pila holandesa.\\nEl curioso y antiguo cuadro eléctrico de color verde controla el molino de galgas y la pila holandesa. Esta última también puede accionarse mediante energía hidráulica.\",\n\"A partir de 1920 se comenzó a producir aquí papel reciclado de forma industrial, gracias a la adquisición de una máquina de forma redonda. Desde la rueda del maxão, la pasta se recoge y se conduce por un canal hasta el tanque de bandejas, donde se filtran las impurezas. La cantidad de pasta que entra es controlada por el maquinista, determinando así el gramaje del papel. Una vez filtrada, la pasta se conduce a un segundo tanque llamado tina. Dentro de la tina, una forma redonda en constante rotación recoge las fibras en suspensión, formando la hoja de papel. La hoja de papel se presiona contra la baeta de lana y se transporta hasta los rodillos de la calandra, donde se prensa para liberar el exceso de agua, separándose de la baeta. A continuación, el maquinista dirige el papel hacia el devanador, una especie de bobina, donde se enrolla. Como hay dos devanadores, cuando uno se llena de papel se sustituye por el vacío.\\nEl papel aún húmedo se coloca sobre la mesa de corte, donde se corta a mano con un cuchillo. Se dobla dos veces para formar las \\\"postas\\\" de papel. Estas permanecen junto a la mesa hasta ser transportadas a la Casa do Espande, donde se ponen a secar.\\nContinúe hasta el final del pasillo, gire a la izquierda y suba hasta el último piso.\",\n\"La Casa do Espande es el espacio destinado al secado del papel. Situada preferentemente en los pisos superiores, es uno de los espacios más característicos de estas antiguas fábricas.\\nComo se puede observar detrás de los actuales cristales de protección, las paredes estaban formadas por persianas de madera regulables, que permitían la circulación del aire para acelerar el secado del papel, o protegían el espacio de la lluvia directa.\\nLas \\\"Botadeiras\\\" eran las trabajadoras que cargaban sobre la cabeza las pilas de papel \\\"verde\\\", aún húmedo, desde la Casa da Máquina hasta el Espande.\\nCada carga pesaba una media de 45 kilos, por lo que no era una tarea fácil. Ya en el Espande, con la ayuda de una horquilla de madera, las trabajadoras \\\"colgaban\\\" a secar las hojas de papel dobladas por la mitad, en las \\\"tesas\\\", una especie de tendales con alambres fijados a soportes de madera. A pesar de la dureza de este trabajo, dadas las condiciones y el esfuerzo requerido, los espandes eran lugares alegres, llenos del canto de las botadeiras, que marcaba un ritmo constante en la tarea de colgar el papel en las tesas.\\nTras el secado, el papel se recogía y se sometía a una primera selección, retirando las hojas rasgadas o defectuosas. Estas volvían a reciclarse. Después de esta selección, el papel se llevaba a la Casa do Lixador.\",\n\"La Casa do Lixador es un espacio amplio, situado al nivel de la carretera. Es el lugar menos frío y húmedo de todo el recinto fabril. Después de secarse en la Casa do Espande, el papel se transportaba hasta aquí para la última fase del proceso de fabricación: los acabados y el embalaje.\\nAquí las trabajadoras seleccionaban el papel de menor tamaño, lo \\\"lijaban\\\", es decir, lo alisaban, y contaban las hojas.\\nUna vez contado, el papel se doblaba por la mitad, formando un cuadernillo de 25 hojas, llamado \\\"mano\\\" de papel. El conjunto de 20 \\\"manos\\\" formaba una resma.\\nEl papel de gran tamaño no pasaba por este proceso de alisado y conteo, sino que simplemente se pesaba en la balanza decimal y se colocaba directamente en la prensa. Ya en la prensa, el papel se golpeaba lateralmente con una maza para alinear las hojas, que se ataban con cuerda o alambre, formando un fardo. Al principio, los fardos eran de 100 kg, reduciéndose después a 50 kg, y hoy son solo de 25 kg.\\nUna vez listos, los fardos y las resmas de papel se cargaban hacia el exterior (por la puerta de acceso a la carretera), transportándose en carros de bueyes, y más tarde en camiones, hacia el mercado local o hacia los mayoristas de la ciudad de Oporto.\",\n\"A partir de principios del siglo XX, en el municipio de Santa Maria da Feira y en municipios vecinos como Ovar, surgieron decenas de \\\"Sacarias\\\" dedicadas a la producción de bolsas de papel.\\nLas Sacarias eran pequeñas empresas donde trabajaban principalmente mujeres —las \\\"saqueiras\\\"— que producían bolsas de papel llamadas \\\"cartuchos\\\". Después de cortado, el papel se extendía en diagonal sobre la mesa de la sacaria, con la ayuda de una regla. A continuación, se aplicaba al papel, con un cepillo, una cola hecha a base de harina de almidón y agua. Los cartuchos se moldeaban entonces con formas de bolsa de diversos tamaños, fijadas al tablero de la mesa. Una vez hechas las bolsas, se colocaban en secaderos para secar la cola.\\nEn algunas sacarias podía haber máquinas para personalizar la bolsa. La más común era la \\\"riscadeira\\\", que imprimía líneas de color magenta o azul. También podía haber pequeñas máquinas de tipografía, como esta del tipo Minerva, que imprimía texto con información sobre el producto o el establecimiento comercial.\\nA partir de la década de 1960, con el auge de la industria del plástico, los viejos cartuchos de papel fueron siendo sustituidos, provocando la decadencia progresiva de las sacarias. Sin embargo, algunas empresas, apostando por la mejora constante del producto y la innovación tecnológica, todavía hoy se encuentran en plena actividad, produciendo embalajes para diversos fines.\\nSalga ahora de la sala y baje las escaleras.\",\n\"En este núcleo expositivo conoceremos el moderno proceso de fabricación del papel, que utiliza como materia prima la madera de eucalipto y de pino.\\nEsta exposición presenta subnúcleos secuenciales que exploran el proceso de transformación, que comienza en el árbol, todavía dentro de su hábitat natural, y termina en la diversidad y sostenibilidad de los productos papeleros portugueses.\\nA lo largo de este recorrido se abordan temas como la gestión sostenible del bosque y la protección de la biodiversidad, la distribución de las especies forestales en Portugal continental, los tipos de fibras utilizados en la producción de papel, las diferentes fases de transformación de la materia prima, el proceso de fabricación y los distintos tipos de papel y sus características.\\nAl final de este núcleo, accediendo al quiosco multimedia, podrá acceder a información complementaria, en particular la identificación de fábricas dedicadas a la producción de pasta y papel en Portugal, curiosidades sobre el eucalipto globulus, sobre la producción de papel y sobre la versatilidad y aplicabilidad del papel y el cartón, de los que resultan nuevos soportes y objetos cotidianos.\",\n\"El cartón compacto, también llamado \\\"papelão\\\", es un cartón más grueso utilizado para embalajes y cajas. Su proceso de fabricación es muy similar al del papel. La principal diferencia se produce al final de la máquina de producción, momento en que el cartón, a diferencia del papel, no se enrolla en el devanador, sino que se corta en placas, colocadas unas sobre otras, hasta el momento del secado. En el pasado, el cartón se producía de forma estacional, ya que se secaba al aire libre, dependiendo por tanto de condiciones climáticas favorables. Con el paso de los años, algunas empresas construyeron una especie de invernadero, con cintas transportadoras, para acelerar este proceso de secado. Una vez seco, el cartón se recogía, se seleccionaba, se alisaba en la laminadora y se agrupaba según su espesor. Se ataba en fardos de 25 kg. En el lateral del fardo se indicaba el número total de hojas de cartón. Los fardos con más hojas correspondían a cartón más fino.\",\n\"\\\"De la Filigrana a la Marca de Agua\\\" es el nombre del núcleo expositivo que nacerá en este espacio, con la presentación de una colección de papeles con marcas de agua nacionales, entre las más representativas de este territorio.\\nLa filigrana es un trabajo ornamental que utiliza hilos metálicos muy finos para formar figuras, letras y números. Estas figuras, a su vez, se bordan o se aplican sobre la superficie de la malla metálica que compone la forma de fabricar papel. La marca de agua del papel, visible a contraluz, es el resultado de la filigrana, ya que sobre los hilos metálicos hay una menor acumulación de fibras, lo que origina zonas de mayor transparencia.\\nDestacamos aquí un rodillo filigranador de la antigua Fábrica de Papel de Matrena, en Tomar, que muestra una filigrana alegórica a la República Portuguesa. Pronto tendremos más novedades que presentarle aquí.\\nPor ahora, nuestra visita está a punto de terminar.\\nEsperamos que haya disfrutado de este viaje por el mundo del papel en las Terras de Santa Maria.\\nSi está utilizando una audioguía del museo, le pedimos por favor que la devuelva en la recepción. También puede visitar nuestra tienda y llevarse un recuerdo de este día.\\nSi aún no lo conoce, le sugerimos visitar el Museu Convento dos Lóios, en la ciudad de Santa Maria da Feira. ¡Gracias y hasta una próxima visita!\",\n];\n\n\nconst NL_NAMES = [\n\"Papiermuseum van Santa Maria da Feira\",\n\"De Voormalige Fabriek van de Azevedos\",\n\"Ruïne van de Fabriek Azevedos de Baixo\",\n\"De Rio Maior\",\n\"De Voormalige Fabriek Custódio Pais\",\n\"Het Engenho da Lourença\",\n\"Het Cilinderhuis\",\n\"Het Hydraulisch Circuit\\n\",\n\"Het Machinehuis\",\n\"De Droogruimte\",\n\"De Schuurruimte\",\n\"De Papieren Zakken Werkplaats\",\n\"Van Bos tot Papier\",\n\"Massief Karton\",\n\"Van Filigraan tot Watermerk\",\n];\n\nconst NL_BODIES = [\n\"Het Museu do Papel Terras de Santa Maria heet u van harte welkom!\\nWij zijn een industrieel museum gewijd aan de geschiedenis van papier, en onze belangrijkste missie is het bewaren van de alledaagse herinneringen aan het papiermakersvak, in een regio met meer dan 300 jaar geschiedenis verbonden aan de papierindustrie.\\nDe eerste papierfabriek van de gemeente werd namelijk al in 1708 opgericht in de parochie São Paio de Oleiros. Van daaruit verspreidde de kunst van het papiermaken zich door de hele gemeente en de omliggende gemeenten. De oprichting van een museum gewijd aan de geschiedenis van papier is dan ook alleszins gerechtvaardigd.\\nHet museum, gelegen in Paços de Brandão, is gehuisvest in twee voormalige fabrieken, de Fábrica Custódio Pais en de Fábrica dos Azevedos. Dit is een levend en beleving gericht museum dat de fabrieksomgeving en de knowhow van het papiermakersvak heeft bewaard. De permanente tentoonstelling \\\"Van Molen tot Fabriek\\\" strekt zich uit over verschillende gebieden, volgens de handmatige en industriële productieprocessen, en vertelt het verhaal van de papierproductie in deze regio.\\nOok vandaag de dag is het nog steeds een van de meest representatieve en belangrijke economische activiteiten van de gemeente. Kom met ons mee en ontdek de geschiedenis van de papierindustrie in het oude Terra de Santa Maria. Wij wensen u een fantastisch bezoek.\",\n\"In de volksmond bekend als Fábrica de Cima (bovenste fabriek), was in dit gebouw de voormalige Fabriek van de Azevedos gevestigd, een van de belangrijkste papierfabrieken van de gemeente Santa Maria da Feira. Francisco José de Azevedo Aguiar Brandão was een innovatieve en visionaire man. In 1825 richtte hij deze \\\"Schrijfpapierfabriek\\\" op, zoals ze in documenten uit die tijd wordt genoemd.\\nNaast de productie van verpakkingspapier lag de grote focus van deze fabriek op de vervaardiging van schrijfpapier, kantoorpapier en velijnpapier. De uitstekende kwaliteit van haar schrijfpapier werd in 1863 bekroond met een bronzen medaille, toegekend door koning D. Luís I.\\nVan deze voormalige fabriek, die tot 1966 in bedrijf bleef, kon een dieselmotor en een deel van de machine voor het verkleinen van papier bewaard worden, die we hier kunnen bekijken.\\nDe enorme rotsformatie in deze zaal is te danken aan het feit dat we ons bevinden in een voormalige granietgroeve die vroeger werd geëxploiteerd. Bij hoogwater treedt de Rio Maior buiten zijn oevers en bedekt hij de gehele rotsmassa waarop het gebouw rust.\\nVolg de gang, ga naar buiten naar de tuin en daal af naar de ruïnes.\",\n\"In de jaren 1840 bouwde Francisco José de Azevedo een tweede papierfabriek, naast de eerste, die bekend werd als Fábrica de Baixo (onderste fabriek).\\nDeze tweede papierfabriek was in bedrijf tot 24 oktober 1954, een zondag die triest de geschiedenis inging als de \\\"dag van de waterhoos\\\". Hevige regenval veroorzaakte een plotselinge stijging van het water van de Rio Maior, wat leidde tot gedeeltelijke, en in sommige gevallen volledige, vernietiging van woningen en papierfabrieken.\\nDe gebouwen van de Fábrica de Cima werden het jaar na deze waterhoos volledig hersteld, maar de Fábrica de Baixo bleef voor altijd een ruïne.\",\n\"De Rio Maior ontspringt in de parochie Lourosa, gemeente Santa Maria da Feira, en mondt uit in de Lagune van Paramos (Barrinha de Esmoriz), een kustlagune gelegen tussen de gemeenten Espinho en Ovar. Onderweg neemt de rivier de naam aan van de plaatsen of parochies die ze doorkruist, zoals Rio de Lamas, Rio Maior, Rio de Paramos, naast andere benamingen.\\nDeze rivier is niet bevaarbaar en heeft geen groot debiet, maar bij het binnenkomen van de parochie Paços de Brandão, in het gebied Rio Maior, krijgt ze een andere dimensie, met natuurlijke en kunstmatige stuwen. De sterke hoogteverschillen in het terrein en de stuwen, ook wel \\\"presas\\\" genoemd, maakten het mogelijk om water via molengoten te leiden, wat energiewinning via waterraderen mogelijk maakte.\\nDe Rio Maior zou best de \\\"papierrivier\\\" genoemd kunnen worden, want van het gebied Rio Maior tot aan de Lagune van Paramos bediende ze vroeger veertien papierfabrieken.\\nVervolg de route naar het volgende gebouw.\",\n\"De geschiedenis van de Fabriek Custódio Pais gaat terug tot 26 oktober 1822, toen Lourença Pinto en Joaquim de Carvalho hun vennootschapsakte ondertekenden. Het was de 6e papierfabriek van de gemeente, maar de enige die een vrouw als medeoprichter had.\\nGebouwd vanuit twee oude meelmolens, begon de Engenho da Lourença als een kleine, eenvoudige molen die papier vel voor vel vervaardigde. De productie was gebaseerd op schaarse, familiale arbeidskrachten, en de werking hing af van de overvloed aan water van de Rio Maior.\\nIn 1827 richtte Joaquim de Carvalho een nieuwe papiermolen op, naast de eerste molen, die op dat moment al bekendstond als de Engenho da Lourença.\\nDeze twee papiermolens werden in 1916 overgenomen door José Ferreira Pais, die ze samenvoegde tot één papierfabriek en jaren later begon met continue papierproductie.\\nIn de jaren 1940 bouwde de familie Ferreira Pais hun woning in het fabrieksgebouw zelf.\\nDit bedrijf bleef, altijd binnen dezelfde familie, actief tot 1989.\",\n\"Lourença Pinto was de eerste vrouwelijke papierondernemer in de Terras de Santa Maria. Hoewel ongeletterd, leidde haar ondernemersgeest ertoe dat ze zich in 1822 associeerde met meester-papiermaker Joaquim Carvalho. Samen bouwden ze een kleine molen voor de ambachtelijke productie van papier vel voor vel, waarbij ze graanmolens aanpasten die Lourença Pinto van haar moeder had geërfd.\\nVroeger bestond de grondstof voor de papierproductie uit hennep-, linnen- en katoenlompen, verkocht aan de papierfabrieken door lompenhandelaren. Deze lompen werden, na gesorteerd te zijn op de zeef en gesneden op de snijtafel, verfijnd in een machine genaamd hollander, tot een homogene, zeer fijne pulp werd verkregen.\\nVervolgens werd deze pulp in de productiekuip geplaatst, in een waterige oplossing bestaande uit 20% pulp en 80% water. Met behulp van een vorm (een houten blad met een bodem van metaalgaas) verzamelde een arbeider, \\\"laurente\\\" genoemd, de zwevende vezels, waardoor het papierblad werd gevormd. Het pas gevormde blad werd omgekeerd op een wollen doek, de \\\"baeta\\\" of vilt. Op elk blad werd een nieuw vilt gelegd, en dit proces werd herhaald tot een stapel werd gevormd, die vervolgens werd geperst om overtollig water te verwijderen. De bladen werden vervolgens te drogen gelegd in de Espande.\",\n\"Hier bevinden zich de machines die de grondstof omzetten in papierpulp.\\nAan het einde van de 19e eeuw, met de toenemende vraag naar papier en de opkomst van meer fabrieken, werden lompen schaars, en moesten er nieuwe grondstoffen worden gevonden. Er werden verschillende proeven gedaan met stro van verschillende granen, en zelfs met rijstschillen, totdat men ontdekte dat houtpulp, rijk aan cellulose, het textiel met uitstekende resultaten kon vervangen.\\nHoewel houtpulp al sinds het midden van de 19e eeuw werd gebruikt voor papierproductie, bleven de fabrieken in onze regio katoenen en linnen lompen gebruiken, waaraan ze gebruikt papier toevoegden.\\nAls gevolg van het gebruik van oud papier als grondstof verscheen een nieuwe machine, de lompen molen (\\\"moinho de galgas\\\"), die het verkleinen van papier vergemakkelijkte.\\nIn de moinho de galgas begint de pulpproductie, door water toe te voegen aan het gebruikte papier, dat door twee molenstenen wordt vermalen. Na 1 uur gaat deze vermalen pulp via een houten kanaal naar de hollander, waar ze gedurende dezelfde periode wordt geraffineerd.\\nNa raffinage wordt de resulterende pulp via een lager kanaal naar het bassin van het \\\"maxão\\\"-rad geleid, aan de buitenkant, rechts.\",\n\"Water is altijd een fundamenteel element geweest voor de papierproductie, zowel tijdens het productieproces als als drijvende kracht voor de opwekking van waterkracht. Deze energie werd sinds het begin van de 18e eeuw gebruikt in de papierfabrieken van Santa Maria da Feira. Vanaf het begin van de 20e eeuw werd waterkracht geleidelijk vervangen door diesel- en elektromotoren, hoewel het een hulpbron bleef wanneer er voldoende rivierwater was om het waterrad aan te drijven.\\nIn de Fabriek Custódio Pais kwam elektrische energie rond 1952, waarmee een deel van het productieproces werd gevoed. Bekijk aan de buitenkant, links, het grote rad dat vandaag de dag nog steeds wordt aangedreven door de kracht van het water van de Rio Maior. Aan de tegenovergestelde kant bevindt zich het bassin van het maxão-rad, dat de in de hollander geraffineerde papierpulp ontvangt.\\nHet merkwaardige en oude groene elektrische schakelbord bestuurt de moinho de galgas en de hollander. Deze laatste kan ook worden aangedreven door waterkracht.\",\n\"Vanaf 1920 werd hier op industriële wijze gerecycled papier geproduceerd, dankzij de aanschaf van een rondzeefmachine. Vanaf het maxão-rad wordt de pulp verzameld en via een goot naar het bakkenbassin geleid, waar onzuiverheden worden gefilterd. De hoeveelheid binnenkomende pulp wordt door de machinist geregeld, waardoor het gewicht van het papier wordt bepaald. Na filtratie wordt de pulp naar een tweede bassin geleid, de zogenaamde kuip. Binnen de kuip verzamelt een constant roterende ronde vorm de zwevende vezels, waardoor het papierblad wordt gevormd. Het papierblad wordt tegen het wollen vilt gedrukt en naar de rollen van de kalander getransporteerd, waar het wordt geperst om overtollig water te verwijderen en zich van het vilt scheidt. Vervolgens leidt de machinist het papier naar de haspel, een soort spoel, waarop het wordt opgerold. Omdat er twee haspels zijn, wordt de volle haspel vervangen door de lege wanneer deze vol raakt.\\nHet nog vochtige papier wordt op de snijtafel gelegd, waar het met de hand met een mes wordt gesneden. Het wordt twee keer gevouwen om de \\\"postas\\\" (bundels) papier te vormen. Deze blijven bij de tafel totdat ze naar de Casa do Espande worden getransporteerd, waar ze te drogen worden gelegd.\\nLoop tot het einde van de gang, sla linksaf en ga naar de bovenste verdieping.\",\n\"De Casa do Espande is de ruimte bestemd voor het drogen van papier. Meestal gelegen op de bovenste verdiepingen, is dit een van de meest kenmerkende ruimtes van deze oude fabrieken.\\nZoals achter de huidige beschermende ruiten te zien is, bestonden de wanden uit verstelbare houten luiken, die luchtcirculatie mogelijk maakten om het drogen van het papier te versnellen, of de ruimte te beschermen tegen directe regen.\\nDe \\\"Botadeiras\\\" waren de vrouwelijke arbeiders die de stapels nog vochtig \\\"groen\\\" papier op hun hoofd droegen, van de Casa da Máquina naar de Espande.\\nElke stapel woog gemiddeld 45 kilo, wat geen gemakkelijke taak was. Eenmaal in de Espande hingen de arbeiders, met behulp van een houten vork, de dubbelgevouwen papierbladen te drogen op de \\\"tesas\\\", een soort droogrekken met vaste draden op houten steunen. Ondanks de zwaarte van dit werk, gezien de omstandigheden en de vereiste inspanning, waren de droogruimtes vrolijke plekken, gevuld met het gezang van de botadeiras, dat een vast ritme gaf aan het werk van het ophangen van het papier op de tesas.\\nNa het drogen werd het papier verzameld en onderworpen aan een eerste selectie, waarbij gescheurde of defecte bladen werden verwijderd. Deze werden opnieuw gerecycled. Na deze selectie werd het papier naar de Casa do Lixador gebracht.\",\n\"De Casa do Lixador is een ruime ruimte, gelegen op straatniveau. Het is de minst koude en vochtige plek van het gehele fabriekscomplex. Na het drogen in de Casa do Espande werd het papier hierheen gebracht voor de laatste fase van het productieproces – de afwerking en verpakking.\\nHier selecteerden de arbeiders het kleinformaat papier, \\\"schuurden\\\" het, dat wil zeggen gladstreken, en telden de bladen.\\nNa telling werd het papier dubbelgevouwen, waardoor een schrift van 25 bladen ontstond, een \\\"hand\\\" papier genoemd. Een set van 20 \\\"handen\\\" vormde een riem.\\nGrootformaat papier onderging dit gladstrijk- en telproces niet, maar werd simpelweg gewogen op de decimale weegschaal en direct in de pers geplaatst. Eenmaal in de pers werd het papier zijdelings geslagen met een hamer om de bladen uit te lijnen, die vervolgens werden vastgebonden met touw of draad, waardoor een baal ontstond. Balen wogen aanvankelijk 100 kg, later verminderd tot 50 kg, en tegenwoordig wegen ze slechts 25 kg.\\nEenmaal klaar, werden de balen en riemen papier naar buiten geladen (via de deur naar de weg) en vervoerd met ossenkarren, en later met vrachtwagens, naar de lokale markt of naar de groothandelaren in de stad Porto.\",\n\"Vanaf het begin van de 20e eeuw ontstonden in de gemeente Santa Maria da Feira en in naburige gemeenten zoals Ovar tientallen \\\"Sacarias\\\" gewijd aan de productie van papieren zakken.\\nDe Sacarias waren kleine bedrijven waar voornamelijk vrouwen werkten – de \\\"saqueiras\\\" – die papieren zakken produceerden, \\\"cartuchos\\\" genoemd. Na het snijden werd het papier diagonaal op de tafel van de sacaria uitgespreid, met behulp van een liniaal. Vervolgens werd lijm, gemaakt op basis van zetmeelmeel en water, met een kwast op het papier aangebracht. De zakken werden vervolgens gevormd met behulp van zakvormen van verschillende afmetingen, bevestigd aan het tafelblad. Eenmaal gemaakt, werden de zakken in droogrekken geplaatst om de lijm te laten drogen.\\nIn sommige sacarias konden machines aanwezig zijn om de zak te personaliseren. De meest voorkomende was de \\\"riscadeira\\\", die lijnen in magenta of blauw drukte. Er konden ook kleine typografische machines zijn, zoals deze van het type Minerva, die tekst afdrukte met informatie over het product of de handelszaak.\\nVanaf de jaren zestig van de vorige eeuw, met de opkomst van de kunststofindustrie, werden de oude papieren zakken geleidelijk vervangen, wat leidde tot de geleidelijke achteruitgang van de sacarias. Sommige bedrijven zetten echter in op voortdurende productverbetering en technologische innovatie, en zijn tot op de dag van vandaag volledig operationeel, en produceren verpakkingen voor verschillende doeleinden.\\nVerlaat nu de zaal en daal de trap af.\",\n\"In dit tentoonstellingsgedeelte maken we kennis met het moderne papierproductieproces, dat eucalyptus- en dennenhout als grondstof gebruikt.\\nDeze tentoonstelling presenteert opeenvolgende subdelen die het transformatieproces verkennen, dat begint bij de boom, nog in zijn natuurlijke habitat, en eindigt bij de diversiteit en duurzaamheid van Portugese papierproducten.\\nGedurende dit traject worden thema's behandeld zoals duurzaam bosbeheer en de bescherming van biodiversiteit, de verspreiding van bosbouwsoorten in continentaal Portugal, de soorten vezels die worden gebruikt bij papierproductie, de verschillende fasen van grondstoftransformatie, het productieproces en verschillende soorten papier en hun eigenschappen.\\nAan het einde van dit gedeelte kunt u via de multimediakiosk toegang krijgen tot aanvullende informatie, onder meer de identificatie van fabrieken die zich toeleggen op pulp- en papierproductie in Portugal, weetjes over de eucalyptus globulus, over papierproductie en over de veelzijdigheid en toepasbaarheid van papier en karton, waaruit nieuwe dagelijkse materialen en objecten voortkomen.\",\n\"Massief karton, ook wel \\\"papelão\\\" genoemd, is een dikker karton dat wordt gebruikt voor verpakkingen en dozen. Het productieproces lijkt sterk op dat van papier. Het belangrijkste verschil doet zich voor aan het einde van de productiemachine, waar het karton, in tegenstelling tot papier, niet op een haspel wordt gewikkeld, maar in platen wordt gesneden, die op elkaar worden gestapeld tot het moment van drogen. Vroeger was de kartonproductie seizoensgebonden, omdat het in de buitenlucht droogde en dus afhankelijk was van gunstige weersomstandigheden. In de loop der jaren bouwden sommige bedrijven een soort kas, met transportbanden, om dit droogproces te versnellen. Na het drogen werd het karton verzameld, gesorteerd, gladgestreken op de lamineermachine en gegroepeerd naar dikte. Het werd gebundeld in balen van 25 kg. Aan de zijkant van de baal werd het totale aantal kartonvellen aangegeven. Balen met meer vellen kwamen overeen met dunner karton.\",\n\"\\\"Van Filigraan tot Watermerk\\\" is de naam van het tentoonstellingsgedeelte dat in deze ruimte zal ontstaan, met de presentatie van een collectie papieren met nationale watermerken, behorend tot de meest representatieve van dit gebied.\\nFiligraan is ornamenteel werk waarbij zeer fijne metaaldraden worden gebruikt om figuren, letters en cijfers te vormen. Deze figuren worden op hun beurt geborduurd of aangebracht op het oppervlak van het metaalgaas dat de papiermakersvorm vormt. Het watermerk van het papier, zichtbaar tegen het licht, is het resultaat van het filigraan, aangezien er over de metaaldraden minder ophoping van vezels is, waardoor gebieden met grotere transparantie ontstaan.\\nWe lichten hier een filigraanrol uit van de voormalige Papierfabriek van Matrena, in Tomar, met een allegorisch filigraan van de Portugese Republiek. We zullen binnenkort meer nieuws hebben om u hier te presenteren.\\nVoor nu loopt ons bezoek ten einde.\\nWij hopen dat u genoten heeft van deze reis door de wereld van papier in de Terras de Santa Maria.\\nAls u een audiogids van het museum gebruikt, verzoeken wij u deze bij de receptie in te leveren. U kunt ook onze winkel bezoeken en een aandenken aan deze dag meenemen.\\nAls u het nog niet kent, raden wij een bezoek aan het Museu Convento dos Lóios aan, in de stad Santa Maria da Feira. Dank u wel en tot een volgend bezoek!\",\n];\n\nfunction emptyEntry() { return {status: 'missing', body: '', a
